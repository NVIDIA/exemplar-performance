# Setup
general:
  workload: nemotron_3
  display_name: nemotron3
  workload_aliases: [nemotron3, nemotron_3, nemotron-super, nemotron-nano, nemotron-3-super, nemotron-3-nano]
  workload_type: pretrain
  framework: megatron_bridge

container:
  images: 
    - 'nvcr.io#nvidia/nemo:26.06.01'

downloads:
  huggingface:
    - repo_id: 'nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16'
    - repo_id: 'nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16'

repositories:
  megatron_bridge:
    url: "https://github.com/NVIDIA-NeMo/Megatron-Bridge.git"
    commit: "b50da4c7404caa41793e74ac40d18798844c7b67"

  nemo_run:
    url: "https://github.com/NVIDIA-NeMo/Run.git"
    commit: "211d4b7439c1b5ee401cfbaba1765454ed438ff5"

setup:
  venv_req: true
  dependencies:
    git:
      megatron_bridge:
        repo_key: megatron_bridge
        install_method:
          type: clone
    pip:
      - package: nemo_run
        repo_key: nemo_run


tools:
  nsys: "2025.5.1.121-3638078"


run:
  launcher_type: 'megatron_bridge'
  launch_script: 'launch.sh'

  gpu_configs:
    gb300:
      model_configs:
        - model_size: '30b'
          dtypes: ['bf16', 'fp8']
          scales: [8, 16, 32, 64]
        - model_size: '120b'
          dtypes: ['bf16', 'fp8']
          scales: [64, 128, 256, 512]

    gb200:
      model_configs:
        - model_size: '30b'
          dtypes: ['bf16']
          scales: [8, 16, 32, 64]
        - model_size: '120b'
          dtypes: ['bf16']
          scales: [64, 128, 256, 512]

    b300:
      model_configs:
        - model_size: '30b'
          dtypes: ['bf16', 'fp8']
          scales: [8, 16, 32, 64]
        - model_size: '120b'
          dtypes: ['bf16']
          scales: [64, 128, 256, 512]

    b200:
      model_configs:
        - model_size: '30b'
          dtypes: ['bf16', 'fp8']
          scales: [8, 16, 32, 64]
        - model_size: '120b'
          dtypes: ['bf16']
          scales: [64, 128, 256, 512]

    h100:
      model_configs:
        - model_size: '30b'
          dtypes: ['bf16']
          scales: [16, 32, 64]
