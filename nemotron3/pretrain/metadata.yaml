# Setup
general:
  workload: nemotron_3
  display_name: nemotron3
  workload_aliases:
    [nemotron3, nemotron_3, nemotron-super, nemotron-ultra, nemotron-3-super, nemotron-3-ultra]
  workload_type: pretrain
  framework: megatron_bridge

container:
  images:
    - 'nvcr.io#nvidia/nemo:26.08.01'

downloads:
  huggingface:
    # The Megatron-Bridge Nemotron 3 Super recipe loads its tokenizer from the Nano repo.
    - repo_id: 'nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16'
    - repo_id: 'nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16'
    - repo_id: 'nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16'

repositories:
  megatron_bridge:
    url: "https://github.com/NVIDIA-NeMo/Megatron-Bridge.git"
    commit: "acd815328f9f6100020b32732d2996fe1408cd45"
  nemo_run:
    url: "https://github.com/NVIDIA-NeMo/Run.git"
    commit: "6a55313352bf7204a01636ea9a59dd61289da253"

setup:
  venv_req: true
  dependencies:
    git:
      megatron_bridge:
        repo_key: megatron_bridge
        install_method:
          type: clone
    pip:
      - package: nemo_run
        repo_key: nemo_run
      # NeMo-Run imports leptonai.api.v1, which leptonai 0.47 removed.
      - 'leptonai==0.27.3'




tools:
  nsys: "2026.5.1.161-3889610"

run:
  launcher_type: 'megatron_bridge'
  launch_script: 'launch.sh'
  execution_targets: [slurm, kubernetes]  # launch script handles CLUSTER_TYPE=kubernetes (nvcre)

  gpu_configs:
    gb300:
      model_configs:
        - model_size: '120b'
          dtypes: ['bf16', 'fp8']
          scales: [64, 128, 256, 512]
        - model_size: '550b'
          dtypes: ['fp8']
          scales: [256]
          exact_scales: true

    gb200:
      model_configs:
        - model_size: '120b'
          dtypes: ['bf16', 'fp8']
          scales: [64, 128, 256, 512]
        - model_size: '550b'
          dtypes: ['fp8']
          scales: [256]
          exact_scales: true

    b300:
      model_configs:
        - model_size: '120b'
          dtypes: ['bf16']
          scales: [64, 128, 256, 512]

    b200:
      model_configs:
        - model_size: '120b'
          dtypes: ['bf16']
          scales: [64, 128, 256, 512]
