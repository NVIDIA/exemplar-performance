# Setup
general:
  workload: deepseek-v3
  display_name: deepseek-v3-mbridge
  workload_aliases: [deepseek-v3, deepseek]
  workload_type: pretrain
  framework: megatron_bridge

container:
  images:
    by_gpu:
      default:
        - 'nvcr.io#nvidia/nemo:26.08.01'
      h100:
        - 'nvcr.io#nvidia/nemo:26.06.01'

downloads:
  huggingface:
    - repo_id: 'deepseek-ai/DeepSeek-V3'
      assets: [config]

repositories:
  by_gpu:
    default:
      megatron_bridge:
        url: "https://github.com/NVIDIA-NeMo/Megatron-Bridge.git"
        commit: "acd815328f9f6100020b32732d2996fe1408cd45"
      nemo_run:
        url: "https://github.com/NVIDIA-NeMo/Run.git"
        commit: "6a55313352bf7204a01636ea9a59dd61289da253"
    h100:
      megatron_bridge:
        url: "https://github.com/NVIDIA-NeMo/Megatron-Bridge.git"
        commit: "b50da4c7404caa41793e74ac40d18798844c7b67"
      nemo_run:
        url: "https://github.com/NVIDIA-NeMo/Run.git"
        commit: "211d4b7439c1b5ee401cfbaba1765454ed438ff5"

setup:
  venv_req: true
  dependencies:
    git:
      megatron_bridge:
        repo_key: megatron_bridge
        install_method:
          type: clone
    pip:
      - package: nemo_run
        repo_key: nemo_run
      # NeMo-Run imports leptonai.api.v1, which leptonai 0.47 removed.
      - 'leptonai==0.27.3'

tools:
  nsys:
    by_gpu:
      default: "2026.5.1.161-3889610"
      h100: "2025.5.1.121-3638078"
      b300: "2025.5.1.121-3638078"

# Run
run:
  launcher_type: 'megatron_bridge'
  launch_script: 'launch.sh'
  execution_targets:
    by_gpu:
      default: [slurm, kubernetes]
      h100: [slurm]  # H100 pins pre-nvcre Megatron-Bridge and nemo-run commits.

  gpu_configs:
    gb300:
      model_configs:
        - model_size: '671b'
          dtypes:
            bf16:
              scales: [128, 256, 512]
            fp8:
              scales: [128, 256, 512]
              proxy_scales: [4, 8, 16, 32, 64, 72, 144, 216, 288, 432, 504, 576]
            nvfp4:
              scales: [128, 256, 512]

    gb200:
      model_configs:
        - model_size: '671b'
          dtypes:
            bf16:
              scales: [256, 512]
            fp8:
              scales: [128, 256, 512]
              proxy_scales: [4, 8, 16, 32, 64, 72, 144, 216, 288, 432, 504, 576]
            nvfp4:
              scales: [256, 512]

    b300:
      model_configs:
        - model_size: '671b'
          dtypes:
            bf16:
              scales: [128, 256, 512]
            fp8:
              scales: [128, 256, 512]
              proxy_scales: [8, 16, 32, 64]
            nvfp4:
              scales: [128, 256, 512]

    b200:
      model_configs:
        - model_size: '671b'
          dtypes:
            bf16:
              scales: [256, 512]
            fp8:
              scales: [128, 256, 512]
              proxy_scales: [8, 16, 32, 64]
            nvfp4:
              scales: [256, 512]

    h100:
      model_configs:
        - model_size: '671b'
          dtypes:
            bf16:
              scales: [1024]
            fp8:
              scales: [1024]
              proxy_scales: [8, 16, 32, 64, 128, 256, 512]
