# Setup
general:
  workload: deepseek-v3-torchtitan
  display_name: deepseek-v3-torchtitan
  workload_aliases: [deepseek-v3-torchtitan]
  workload_type: pretrain
  framework: torchtitan

container:
  images: 
    - 'nvcr.io#nvidia/pytorch:25.12-py3'

repositories:
  torchtitan:
    url: "https://github.com/elfiegg/torchtitan.git"
    commit: "b5351f166b2751684aeb1d2cb15ceb619d383ae0"

downloads:
  huggingface:
    repos:
      - repo_id: allenai/c4
        repo_type: dataset
        target: shared
        name: c4
        include:
          - "en/*"
          - "dataset_info.json"
          - "*.py"
          - "README.md"

setup:
  venv_req: true
  dependencies:
    git:
      torchtitan:
        repo_key: torchtitan
        install_method:
          type: clone
    pip:
      - 'huggingface_hub[cli]'
      - 'requests'
  tasks:
    - name: container_setup
      cmd: './install_torchtitan_to_container.sh'
      job_type: srun
      requires_gpus: false
    - name: tokenizer_download
      cmd: './download_hf_assets.sh'
      job_type: local
      requires_gpus: false

# Run
run:
  launcher_type: 'configured_sbatch'
  launch_script: 'launch.sh'

  gpu_configs:
    b200:
      model_configs:
        - model_size: '671b'
          dtypes:
            bf16: [256]
            fp8: [256]
    h100:
      model_configs:
        - model_size: '671b'
          dtypes:
            bf16: [512]

    gb200:
      model_configs:
        - model_size: '671b'
          dtypes:
            bf16: [256]
            fp8: [256]
