# Setup
general:
  workload: gpt_oss_mlperf
  display_name: gpt-oss-mlperf
  workload_aliases: [gpt_oss_mlperf, gpt-oss-mlperf]
  workload_type: pretrain
  framework: megatron_bridge

container:
  images: 
    - 'nvcr.io#nvidia/nemo:26.08.01'

repositories: 
  megatron_bridge:
    url: "https://github.com/NVIDIA-NeMo/Megatron-Bridge.git"
    commit: "31a3c7721ef816104a3f5d7ca7611b42a3a18f0e"
  nemo_run:
    url: "https://github.com/NVIDIA-NeMo/Run.git"
    commit: "a960fc61093d0b119110a1272e9c2cb22a6edd91"

downloads:
  huggingface:
    - repo_id: 'openai/gpt-oss-20b'
      assets: [config]

setup:
  venv_req: true
  dependencies:
    git:
      megatron_bridge:
        repo_key: megatron_bridge
        install_method:
          type: clone
    pip:
      - package: nemo_run
        repo_key: nemo_run
      # NeMo-Run imports leptonai.api.v1, which leptonai 0.47 removed.
      - 'leptonai==0.27.3'

# Run
run:
  launcher_type: 'megatron_bridge'
  launch_script: 'launch.sh'

  gpu_configs:
    gb300:
      model_configs:
        - model_size: '20b'
          dtypes:
            nvfp4: [8, 72]
            fp8: [8, 72, 512]
    gb200:
      model_configs:
        - model_size: '20b'
          dtypes:
            nvfp4: [8, 72]
            fp8: [8, 72, 512]

