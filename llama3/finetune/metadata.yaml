# Setup
general:
  workload: llama3
  display_name: llama3
  workload_aliases: [llama3, llama]
  workload_type: finetune
  framework: megatron_bridge

container:
  images: 
    - 'nvcr.io#nvidia/nemo:26.06.01'

downloads:
  huggingface:
    cache:
      - repo_id: 'meta-llama/Meta-Llama-3-70B'
        assets: [tokenizer, config]
    repos:
      - repo_id: 'meta-llama/Meta-Llama-3-70B'
        repo_type: model
        name: Meta-Llama-3-70B
      - repo_id: 'rajpurkar/squad'
        repo_type: dataset
        name: squad

repositories:
  megatron_bridge:
    url: "https://github.com/NVIDIA-NeMo/Megatron-Bridge.git"
    commit: "b50da4c7404caa41793e74ac40d18798844c7b67"
  nemo_run:
    url: "https://github.com/NVIDIA-NeMo/Run.git"
    commit: "211d4b7439c1b5ee401cfbaba1765454ed438ff5"

setup:
  venv_req: true
  dependencies:
    git:
      megatron_bridge:
        repo_key: megatron_bridge
        install_method:
          type: clone
    pip:
      - package: nemo_run
        repo_key: nemo_run
  tasks:
    - name: checkpoint_dataset_download
      cmd: './download_ckpt_dataset.sh'
      job_type: srun
      requires_gpus: true


tools:
  nsys: "2025.5.1.121-3638078"

# Run
run:
  launcher_type: 'megatron_bridge'
  launch_script: 'launch.sh'

  gpu_configs:
    gb300:
      model_configs:
        - model_size: '70b'
          dtypes: ['bf16', 'fp8']
          scales: [8, 16]
          exact_scales: true

    gb200:
      model_configs:
        - model_size: '70b'
          dtypes: ['bf16', 'fp8']
          scales: [8, 16]
          exact_scales: true

    b300:
      model_configs:
        - model_size: '70b'
          dtypes: ['bf16', 'fp8']
          scales: [8, 16]
          exact_scales: true

    b200:
      model_configs:
        - model_size: '70b'
          dtypes: ['bf16', 'fp8']
          scales: [8, 16]
          exact_scales: true

    h100:
      model_configs:
        - model_size: '70b'
          dtypes: ['bf16', 'fp8']
          scales: [8, 16]
          exact_scales: true
