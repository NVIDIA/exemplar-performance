# Setup
general:
  workload: cpu_overhead
  workload_type: microbenchmark
  framework: trt-llm

container:
  images:
    - 'nvcr.io#nvidia/tensorrt-llm/release:1.1.0rc5'

repositories:
  trt-llm:
    url: "https://github.com/NVIDIA/TensorRT-LLM.git"
    commit: "0c9430e5a530ba958fc9dca561a3ad865ad9f492"

downloads:
  huggingface:
    repos:
      - repo_id: openai/gpt-oss-120b
        repo_type: model
        name: gpt-oss-120b

setup:
  venv_req: true
  dependencies:
    git:
      trt-llm:
        repo_key: trt-llm
        install_method:
          type: clone
    pip:
      - 'click==8.2.1'
      - 'transformers==4.52.4'
      - 'pillow==11.2.1'
      - 'datasets==3.6.0'
      - 'pydantic==2.11.7'

# Run
run:
  launcher_type: 'configured_sbatch'
  launch_script: 'launch.sh'

  gpu_configs:
    gb300:
      model_configs:
        - model_size: '120b'
          dtypes: ['mxfp4']
          scales: [1, 4]
          exact_scales: true
    gb200:
      model_configs:
        - model_size: '120b'
          dtypes: ['mxfp4']
          scales: [1, 4]
          exact_scales: true
    b300:
      model_configs:
        - model_size: '120b'
          dtypes: ['mxfp4']
          scales: [1, 4]
          exact_scales: true
    b200:
      model_configs:
        - model_size: '120b'
          dtypes: ['mxfp4']
          scales: [1, 4]
          exact_scales: true
    h100:
      model_configs:
        - model_size: '120b'
          dtypes: ['mxfp4']
          scales: [1, 4]
          exact_scales: true
