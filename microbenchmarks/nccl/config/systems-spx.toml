[common]

[common.run_params]
sbatch = [
    "--exclusive",
    "--mem=0",
    "--output=%x_%j.out"
]
srun = [
    "-N ${SLURM_JOB_NUM_NODES}",
    "--mpi=pmix",
    "--distribution=$(llmb_nccl_distribution)",
    "--cpu-bind=none"
]
nccl = [
    "NCCL_NET=spcx",
    "NCCL_NET_PLUGIN=spcx",
    "NCCL_ENV_PLUGIN=spcx",
    "NCCL_IB_TC=${NCCL_IB_TC:-96}",
    "NCCL_IB_TIMEOUT=${NCCL_IB_TIMEOUT:-18}",
    "UCX_TLS=${UCX_TLS:-self,tcp}",
    "OMPI_MCA_coll_ucc_enable=${OMPI_MCA_coll_ucc_enable:-1}"
]

[gb300.labels]
name = "gb300"
network = "Spectrum-X"
gpu_type = "gb300"
gpus_per_node = "4"

[gb300.run_params]
sbatch = [
    "--ntasks-per-node=4"
]

