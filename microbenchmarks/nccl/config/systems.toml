[common]

[common.run_params]
sbatch = [
    "--exclusive",
    "--mem=0",
    "--mail-type=FAIL",
    "--output=%x_%j.out",
    "--comment=sysctl-sys.kernel.numa_balancing=0,transparent_hugepage_defrag=never,transparent_hugepage=never"
]

srun = [
    "-N ${SLURM_JOB_NUM_NODES}",
    "--mpi=pmix"
]

openmpi = [
    "-np ${LOG_NPS}",
    "-N ${nps}",
    "--map-by ppr:${nps}:node",
    "--oversubscribe",
    "--mca btl tcp,self",
    "--mca btl_tcp_if_include $TCP_IF_INCLUDE",
    "--mca coll_hcoll_enable 0",
    "--mca coll_ucc_enable ${OMPI_MCA_coll_ucc_enable:-1}",
    "-x LD_LIBRARY_PATH",
    "-x UCX_TLS=${UCX_TLS:-rc,sm}",
    "-x OMPI_MCA_coll_ucc_enable=${OMPI_MCA_coll_ucc_enable:-1}",
    "-x UCX_NET_DEVICES=$UCX_NET_DEVICE",
    "--bind-to none"
]

mpich = []

[gb300]

[gb300.labels]
name = "gb300"
network = "IB"
switch = "Quantum3"
nic = "CX8"
gpu_type = "b300"

[gb300.run_params]
sbatch = [
    "--ntasks-per-node=4"
]
srun = [
    "--cpu-bind=mask_cpu:0x000000000000000000000000000FFFFFFFFF,0x000000000000000000FFFFFFFFF000000000,0x000000000FFFFFFFFF000000000000000000,0xFFFFFFFFF000000000000000000000000000"
]
nccl = [
    "NCCL_DEBUG=WARN",
    "NCCL_DEBUG_SUBSYS=INIT,ENV,GRAPH,TUNING,NET",
    "NCCL_NET=IB",
    "NCCL_IB_SL=1",
    "NCCL_NET_PLUGIN=none",
    "UCX_TLS=${UCX_TLS:-self,tcp}",
    "OMPI_MCA_coll_ucc_enable=${OMPI_MCA_coll_ucc_enable:-1}"
]

