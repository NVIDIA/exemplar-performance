NCCL_P2P_DISABLE = "1"
NCCL_SHM_DISABLE = "1"
NCCL_PXN_DISABLE = "1"
[test.sweep_args]
-d = "uint8"

[[test]]
name = "sendrecv_nonvlink"
binary = "sendrecv_perf"
envs_merge_strategy = "override"
args_merge_strategy = "override"
[test.sweep_envs]
