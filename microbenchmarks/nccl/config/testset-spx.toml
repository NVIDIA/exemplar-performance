# NCCL Test Configuration
description = "Spectrum-X NCCL: baseline, per-node split and NoNVLink, registration 0/1, 128K-16G."
library_name = "nccl"
testset_iterations = 1
test_iterations = 1

[common]
path = "${NCCL_TEST_PATH}"

[common.sweep_envs]
NCCL_DEBUG = "INFO"
NCCL_DEBUG_FILE = "nccl_debug_file.%h.%p.txt"
NCCL_DEBUG_SUBSYS = "INIT,ENV,GRAPH,TUNING,NET"
NCCL_TESTS_SPLIT = "AND 0"

[common.sweep_args]
-t = 1
-g = 1
-f = 2
-n = 200
-w = 50
-b = "128K"
-e = "16G"
-d = "float"
-R = [0, 1]
-c = 1


# --- Baseline: all ranks, -R0/-R1 ---

[[test]]
name = "all_reduce_baseline"
binary = "all_reduce_perf"
envs_merge_strategy = "override"
args_merge_strategy = "override"

[[test]]
name = "all_gather_baseline"
binary = "all_gather_perf"
envs_merge_strategy = "override"
args_merge_strategy = "override"

[[test]]
name = "reduce_scatter_baseline"
binary = "reduce_scatter_perf"
envs_merge_strategy = "override"
args_merge_strategy = "override"

[[test]]
name = "alltoall_baseline"
binary = "alltoall_perf"
envs_merge_strategy = "override"
args_merge_strategy = "override"
[test.sweep_args]
-d = "uint8"

[[test]]
name = "sendrecv_baseline"
binary = "sendrecv_perf"
envs_merge_strategy = "override"
args_merge_strategy = "override"
[test.sweep_args]
-d = "uint8"
-a = 2


# --- Split: one GPU per node per communicator, -R0/-R1 ---

[[test]]
name = "all_reduce_split"
binary = "all_reduce_perf"
envs_merge_strategy = "override"
args_merge_strategy = "override"
[test.sweep_envs]
NCCL_TESTS_SPLIT = "MOD ${SYS_INFO_GPUS_PER_NODE}"
NCCL_MNNVL_ENABLE = "0"

[[test]]
name = "all_gather_split"
binary = "all_gather_perf"
envs_merge_strategy = "override"
args_merge_strategy = "override"
[test.sweep_envs]
NCCL_TESTS_SPLIT = "MOD ${SYS_INFO_GPUS_PER_NODE}"
NCCL_MNNVL_ENABLE = "0"

[[test]]
name = "reduce_scatter_split"
binary = "reduce_scatter_perf"
envs_merge_strategy = "override"
args_merge_strategy = "override"
[test.sweep_envs]
NCCL_TESTS_SPLIT = "MOD ${SYS_INFO_GPUS_PER_NODE}"
NCCL_MNNVL_ENABLE = "0"

[[test]]
name = "alltoall_split"
binary = "alltoall_perf"
envs_merge_strategy = "override"
args_merge_strategy = "override"
[test.sweep_envs]
NCCL_TESTS_SPLIT = "MOD ${SYS_INFO_GPUS_PER_NODE}"
NCCL_MNNVL_ENABLE = "0"
[test.sweep_args]
-d = "uint8"

[[test]]
name = "sendrecv_split"
binary = "sendrecv_perf"
envs_merge_strategy = "override"
args_merge_strategy = "override"
[test.sweep_envs]
NCCL_TESTS_SPLIT = "MOD ${SYS_INFO_GPUS_PER_NODE}"
NCCL_MNNVL_ENABLE = "0"
[test.sweep_args]
-d = "uint8"
-a = 2


# --- NoNVLink: cyclic ranks, MNNVL/P2P/SHM/PXN disabled, -R0/-R1 ---

[[test]]
name = "all_reduce_nonvlink"
binary = "all_reduce_perf"
envs_merge_strategy = "override"
args_merge_strategy = "override"
[test.sweep_envs]
NCCL_MNNVL_ENABLE = "0"
NCCL_P2P_DISABLE = "1"
NCCL_SHM_DISABLE = "1"
NCCL_PXN_DISABLE = "1"

[[test]]
name = "all_gather_nonvlink"
binary = "all_gather_perf"
envs_merge_strategy = "override"
args_merge_strategy = "override"
[test.sweep_envs]
NCCL_MNNVL_ENABLE = "0"
NCCL_P2P_DISABLE = "1"
NCCL_SHM_DISABLE = "1"
NCCL_PXN_DISABLE = "1"

[[test]]
name = "reduce_scatter_nonvlink"
binary = "reduce_scatter_perf"
envs_merge_strategy = "override"
args_merge_strategy = "override"
[test.sweep_envs]
NCCL_MNNVL_ENABLE = "0"
NCCL_P2P_DISABLE = "1"
NCCL_SHM_DISABLE = "1"
NCCL_PXN_DISABLE = "1"

[[test]]
name = "alltoall_nonvlink"
binary = "alltoall_perf"
envs_merge_strategy = "override"
args_merge_strategy = "override"
[test.sweep_envs]
