# Setup
general:
  workload: nccl
  workload_type: microbenchmark
  framework: megatron_bridge

container:
  images: 
    - 'nvcr.io#nvidia/nemo:26.06.01'

repositories:
  comms-perf:
    url: "https://github.com/NVIDIA/Nvidia-Comms-Perf-Suite.git"
    commit: "3773f3a5495e8cfb83bb34709b9a21627ecc3117"

setup:
  venv_req: true
  dependencies:
    git:
      comms-perf:
        repo_key: comms-perf
        install_method:
          type: clone
  tasks:
    - name: Generate NCCL launch script
      cmd: './setup_nccl_launcher.sh'
      job_type: local
      requires_gpus: false

# Run
run:
  launcher_type: 'sbatch'
  launch_script: 'launch.sh'

  gpu_configs:
    gb300:
      model_configs:
        - model_size: 'nccl'
          dtypes: ['fp8']
          scales: [4, 8, 16, 32, 64, 128, 256, 512]
    gb200:
      model_configs:
        - model_size: 'nccl'
          dtypes: ['fp8']
          scales: [4, 8, 16, 32, 64, 128, 256, 512]
    b200:
      model_configs:
        - model_size: 'nccl'
          dtypes: ['fp8']
          scales: [8, 16, 32, 64, 128, 256, 512]
    b300:
      model_configs:
        - model_size: 'nccl'
          dtypes: ['fp8']
          scales: [8, 16, 32, 64, 128, 256, 512]
    h100:
      model_configs:
        - model_size: 'nccl'
          dtypes: ['fp8']
          scales: [8, 16, 32, 64, 128, 256, 512]
  
