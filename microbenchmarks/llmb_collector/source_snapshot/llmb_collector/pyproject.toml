[project]
name = "llmb-collector"
version = "0.1.2"
description = "Scrape cluster and hardware info with machine-friendly report output"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">3.11,<3.16"
dependencies = [
    "llmb-capabilities>=1,<2",
    "pyyaml>=6.0.2",
]

[project.scripts]
llmb-collector = "llmb_collector:main"

[project.entry-points.llmb]
commands_config = "llmb_collector.command_loader:get_packaged_commands_config"
collector = "llmb_collector.provider:get_provider"

# Generic capability registry; see README "Capability registry".
[project.entry-points."llmb_capabilities"]
default = "llmb_collector.capabilities:CAPABILITIES"

[project.optional-dependencies]
secrets = [
    "detect-secrets>=1.5.0",
]

# Lets the CI "Publish to Artifactory" job use `uv publish --index nv`
# instead of spelling out --publish-url/--check-url separately; see
# https://docs.astral.sh/uv/guides/package/#publishing-your-package.
# explicit = true: nothing here is pinned to this index via
# [tool.uv.sources], so this keeps it out of ordinary dependency
# resolution (uv sync / uv pip install) and usable only when named
# explicitly, e.g. by `uv publish --index nv`.
[[tool.uv.index]]
name = "nv"
url = "https://urm.nvidia.com/artifactory/api/pypi/nv-shared-pypi-local/simple"
publish-url = "https://urm.nvidia.com/artifactory/api/pypi/nv-shared-pypi-local"
explicit = true

# Pins llmb-capabilities to the internal index explicitly, rather than
# relying on index resolution order, so a same-named package published to
# public PyPI in the future could never be resolved instead.
[tool.uv.sources]
llmb-capabilities = { index = "nv" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmb_collector"]

[dependency-groups]
test = [
    "coverage>=7.13.4",
    "pytest>=8.0",
    "pytest-cov>=7.0.0",
]
dev = [
    "python-semantic-release>=10.5.3",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore: bump version to {version} [skip ci]"
tag_format = "v{version}"
logging_use_named_masks = false
allow_zero_version = true

[tool.semantic_release.remote]
type = "gitlab"
token = { env = "GL_TOKEN" }

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog.default_templates]
# Top-level `changelog.changelog_file` is deprecated in PSR v10 and breaks
# in v11; the new home is here under `default_templates`.
changelog_file = "CHANGELOG.md"

[tool.semantic_release.publish]
# GitLab's HVCS in PSR has no upload_dists implementation — calling it
# emits a UserWarning per dist glob during `semantic-release publish`.
# Empty list short-circuits the publish loop. GitLab releases manage
# their own artifact attachments via the Package Registry / Release API,
# not via PSR's per-release file uploads.
dist_glob_patterns = []
upload_to_vcs_release = false
