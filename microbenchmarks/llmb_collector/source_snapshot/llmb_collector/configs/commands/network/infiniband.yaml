commands:
  ibstat:
    description: InfiniBand device and port state.
    argv:
      - ibstat
  ibstat_list:
    description: List InfiniBand CAs.
    argv:
      - ibstat
      - -l
  ibv_devices:
    description: List RDMA devices.
    argv:
      - ibv_devices
  ibv_devinfo:
    description: RDMA device capabilities and port info.
    argv:
      - ibv_devinfo
  ibv_devinfo_verbose:
    description: Verbose RDMA device information.
    argv:
      - ibv_devinfo
      - -v
  rdma_link:
    description: RDMA link state.
    argv:
      - rdma
      - link
  rdma_dev:
    description: RDMA device list.
    argv:
      - rdma
      - dev
  rdma_statistic:
    description: RDMA statistics.
    argv:
      - rdma
      - statistic
