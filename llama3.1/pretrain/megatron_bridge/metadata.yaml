# Setup
general:
  workload: llama3.1
  display_name: llama3.1
  workload_aliases: [llama3.1, llama, llama3]
  workload_type: pretrain
  framework: megatron_bridge

container:
  images: 
    - 'nvcr.io#nvidia/nemo:26.06.01'

repositories: 
  megatron_bridge:
    url: "https://github.com/NVIDIA-NeMo/Megatron-Bridge.git"
    commit: "b50da4c7404caa41793e74ac40d18798844c7b67"
  nemo_run:
    url: "https://github.com/NVIDIA-NeMo/Run.git"
    commit: "211d4b7439c1b5ee401cfbaba1765454ed438ff5"

downloads:
  huggingface:
    - repo_id: 'meta-llama/Meta-Llama-3-8B'
      assets: [config]
    - repo_id: 'meta-llama/Meta-Llama-3-70B'
      assets: [config]
    - repo_id: 'meta-llama/Meta-Llama-3.1-405B'
      assets: [config]

setup:
  venv_req: true
  dependencies:
    git:
      megatron_bridge:
        repo_key: megatron_bridge
        install_method:
          type: clone
    pip:
      - package: nemo_run
        repo_key: nemo_run


tools:
  nsys: "2025.5.1.121-3638078"


# Run
run:
  launcher_type: 'megatron_bridge'
  launch_script: 'launch.sh'

  gpu_configs:
    gb300:
      model_configs:
        - model_size: '405b'
          dtypes: ['fp8', 'nvfp4']
          scales: [256, 512]
        - model_size: '70b'
          dtypes: ['fp8', 'nvfp4']
          scales: [64,128,256,512]
        - model_size: '8b'
          dtypes: ['fp8', 'nvfp4']
          scales: [8,16,32,64,128]
    gb200:
      model_configs:
        - model_size: '405b'
          dtypes: ['fp8', 'nvfp4']
          scales: [256, 512]
        - model_size: '70b'
          dtypes: ['fp8', 'nvfp4']
          scales: [64,128,256,512]
        - model_size: '8b'
          dtypes: ['fp8', 'nvfp4']
          scales: [8,16,32,64,128]
    b300:
      model_configs:
        - model_size: '405b'
          dtypes: ['fp8', 'nvfp4']
          scales: [256, 512]
        - model_size: '70b'
          dtypes: ['fp8', 'nvfp4']
          scales: [64,128,256,512]
        - model_size: '8b'
          dtypes: ['fp8', 'nvfp4']
          scales: [8,16,32,64,128]
    b200:
      model_configs:
        - model_size: '405b'
          dtypes: ['fp8', 'nvfp4']
          scales: [256, 512]
        - model_size: '70b'
          dtypes: ['fp8', 'nvfp4']
          scales: [64,128,256,512]
        - model_size: '8b'
          dtypes: ['fp8', 'nvfp4']
          scales: [8,16,32,64,128]
    h100:
      model_configs:
        - model_size: '405b'
          dtypes:  ['bf16', 'fp8']
          scales:  [1024]
        - model_size: '70b'
          dtypes:  ['bf16', 'fp8']
          scales:  [64,128,256,512]
        - model_size: '8b'
          dtypes:  ['bf16', 'fp8']
          scales:  [8,16,32,64,128]
