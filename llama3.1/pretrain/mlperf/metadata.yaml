# Setup
general:
  workload: llama3.1_mlperf
  display_name: llama3.1-mlperf
  workload_aliases: [llama3.1_mlperf, llama3.1-mlperf]
  workload_type: pretrain
  framework: megatron_bridge

container:
  images: 
    - 'nvcr.io#nvidia/nemo:26.08.01'

repositories: 
  megatron_bridge:
    url: "https://github.com/NVIDIA-NeMo/Megatron-Bridge.git"
    commit: "24960ca5238ba5bbb7c10a9e0088f42c26222429"
  nemo_run:
    url: "https://github.com/NVIDIA-NeMo/Run.git"
    commit: "a960fc61093d0b119110a1272e9c2cb22a6edd91"

downloads:
  huggingface:
    - repo_id: 'meta-llama/Meta-Llama-3.1-8B'
      assets: [config]

setup:
  venv_req: true
  dependencies:
    git:
      megatron_bridge:
        repo_key: megatron_bridge
        install_method:
          type: clone
    pip:
      - package: nemo_run
        repo_key: nemo_run
      # NeMo-Run imports leptonai.api.v1, which leptonai 0.47 removed.
      - 'leptonai==0.27.3'

tools:
  cuda_cupti_lib: "13.0.85"

# Run
run:
  launcher_type: 'megatron_bridge'
  launch_script: 'launch.sh'

  gpu_configs:
    gb300:
      model_configs:
        - model_size: '8b'
          dtypes:
            nvfp4: [8, 72]
    gb200:
      model_configs:
        - model_size: '8b'
          dtypes:
            nvfp4: [8, 72]
