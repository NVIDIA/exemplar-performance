# Setup
general:
  workload: llama3.1_mlperf
  display_name: llama3.1-mlperf
  workload_aliases: [llama3.1_mlperf, llama3.1-mlperf]
  workload_type: pretrain
  framework: megatron_bridge

container:
  images: 
    - 'nvcr.io#nvidia/nemo:26.06.01'

repositories: 
  megatron_bridge:
    url: "https://github.com/NVIDIA-NeMo/Megatron-Bridge.git"
    commit: "f21e0c891ec07469163b0960e0259ade384a778c"
  nemo_run:
    url: "https://github.com/NVIDIA-NeMo/Run.git"
    commit: "f163b1c0dcacb87eb7341a207663ef2a2c302478"

downloads:
  huggingface:
    - repo_id: 'meta-llama/Meta-Llama-3.1-8B'
      assets: [config]

setup:
  venv_req: true
  dependencies:
    git:
      megatron_bridge:
        repo_key: megatron_bridge
        install_method:
          type: clone
    pip:
      - package: nemo_run
        repo_key: nemo_run

tools:
  cuda_cupti_lib: "13.0.85"

# Run
run:
  launcher_type: 'megatron_bridge'
  launch_script: 'launch.sh'

  gpu_configs:
    gb300:
      model_configs:
        - model_size: '8b'
          dtypes:
            nvfp4: [8, 72]
    gb200:
      model_configs:
        - model_size: '8b'
          dtypes:
            nvfp4: [8, 72]
