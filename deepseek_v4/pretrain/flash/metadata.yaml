general:
  workload: deepseek-v4
  display_name: deepseek-v4-mbridge
  workload_aliases: [deepseek-v4, dsv4]
  workload_type: pretrain
  framework: megatron_bridge

container:
  images:
    - 'nvcr.io#nvidia/nemo:26.08.01'

downloads:
  huggingface:
    cache:
      - repo_id: 'deepseek-ai/DeepSeek-V4-Flash'
        assets: [config]

repositories:
  megatron_bridge:
    url: "https://github.com/NVIDIA-NeMo/Megatron-Bridge.git"
    commit: "acd815328f9f6100020b32732d2996fe1408cd45"
  megatron_lm:
    url: "https://github.com/NVIDIA/Megatron-LM.git"
    commit: "2b31f24598a0ef9a9e871bd82ffcdd2f61ca38af"
  nemo_run:
    url: "https://github.com/NVIDIA-NeMo/Run.git"
    commit: "6a55313352bf7204a01636ea9a59dd61289da253"

setup:
  venv_req: true
  dependencies:
    git:
      megatron_bridge:
        repo_key: megatron_bridge
        install_method:
          type: clone
      megatron_lm:
        repo_key: megatron_lm
        install_method:
          type: clone
    pip:
      - package: nemo_run
        repo_key: nemo_run
      # NeMo-Run imports leptonai.api.v1, which leptonai 0.47 removed.
      - 'leptonai==0.27.3'

tools:
  nsys:
    by_gpu:
      gb300: "2026.5.1.161-3889610"
      gb200: "2026.5.1.161-3889610"
      b300: "2025.5.1.121-3638078"
      b200: "2026.5.1.161-3889610"

run:
  launcher_type: 'megatron_bridge'
  launch_script: 'launch.sh'
  execution_targets: [slurm, kubernetes]  # launch script handles CLUSTER_TYPE=kubernetes (nvcre)

  gpu_configs:
    gb300:
      model_configs:
        - model_size: '284b'
          dtypes: ['fp8']
          scales: [128, 256, 512]
          exact_scales: true
    gb200:
      model_configs:
        - model_size: '284b'
          dtypes: ['fp8']
          scales: [128, 256, 512]
          exact_scales: true
    b300:
      model_configs:
        - model_size: '284b'
          dtypes: ['fp8']
          scales: [128, 256, 512]
          exact_scales: true
    b200:
      model_configs:
        - model_size: '284b'
          dtypes: ['fp8']
          scales: [128, 256, 512]
          exact_scales: true
