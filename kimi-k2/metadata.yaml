# Setup
general:
  workload: kimi-k2
  display_name: kimi-k2
  workload_aliases: [kimi-k2, kimi]
  workload_type: pretrain
  framework: megatron_bridge

container:
  images:
    by_gpu:
      default:
        - 'nvcr.io#nvidia/nemo:26.06.01'
      b200:
        - 'nvcr.io#nvidia/nemo:26.04.01'

downloads:
  huggingface:
    - repo_id: 'moonshotai/Kimi-K2-Instruct'
      assets: [config]

# B200 stays on the NeMo 26.04.01 container, so it keeps the Megatron-Bridge
# commit that container was validated against. The other GPUs run NeMo 26.06.01.
repositories:
  by_gpu:
    default:
      megatron_bridge:
        url: "https://github.com/NVIDIA-NeMo/Megatron-Bridge.git"
        commit: "b50da4c7404caa41793e74ac40d18798844c7b67"

      nemo_run:
        url: "https://github.com/NVIDIA-NeMo/Run.git"
        commit: "211d4b7439c1b5ee401cfbaba1765454ed438ff5"

    b200:
      megatron_bridge:
        url: "https://github.com/NVIDIA-NeMo/Megatron-Bridge.git"
        commit: "06f25c227ef9d3d9b22e5561fb9f46e1cbdab7e2"

      nemo_run:
        url: "https://github.com/NVIDIA-NeMo/Run.git"
        commit: "211d4b7439c1b5ee401cfbaba1765454ed438ff5"

setup:
  venv_req: true
  dependencies:
    git:
      megatron_bridge:
        repo_key: megatron_bridge
        install_method:
          type: clone
    pip:
      - package: nemo_run
        repo_key: nemo_run
      # NeMo-Run imports leptonai.api.v1, which leptonai 0.47 removed.
      - 'leptonai==0.27.3'


tools:
  nsys: "2025.5.1.121-3638078"

# Run
run:
  launcher_type: 'megatron_bridge'
  launch_script: 'launch.sh'

  gpu_configs:
    gb300:
      model_configs:
        - model_size: '1t'
          dtypes: ['fp8']
          scales: [512, 256]

    gb200:
      model_configs:
        - model_size: '1t'
          dtypes: ['fp8']
          scales: [512, 256]

    b300:
      model_configs:
        - model_size: '1t'
          dtypes: ['fp8']
          scales: [512, 256]

    b200:
      model_configs:
        - model_size: '1t'
          dtypes: ['fp8']
          scales: [512, 256]
