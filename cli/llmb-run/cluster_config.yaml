# Cluster configuration schema version.
schema_version: 2

# High-level cluster configuration.
llmb_repo: "/path/to/LLMB_REPO"
llmb_install: "/lustre/path/to/LLMB_INSTALL"
gpu_type: "gb200"  # GPU_TYPE assumed to be homogeneous environment.
# cluster_name: "cluster_name"        # Optional
# Execution mode: 'slurm' (Slurm jobs) or 'kubernetes' (nvcre WorkloadRun).
execution_target: "slurm"

# Install metadata.
install:
  node_architecture: "aarch64"  # Node architecture for profiling/tool mount selection.

# Any environment variables that should apply to all workloads.
environment: {}

# Kubernetes settings — only used when execution_target is "kubernetes"; with
# any other target the presence of this block is a configuration error.
# kubernetes:
#   namespace: "default"
#   image_pull_secrets: []
#   # Name of a pre-created Kubernetes Secret holding the HuggingFace token.
#   # Create it with: kubectl create secret generic hf-token-secret \
#   #   --from-literal=token=<HF_TOKEN> -n <namespace>
#   hf_token_secret_name: ""   # e.g. "hf-token-secret"
#   hf_token_secret_key: "token"

slurm:
  account: "all_the_fairshare"
  gpu:
    partition: "gpu_partition"
    gres: 8
  cpu:
    partition: "cpu_partition"
    gres: null  # Optional: unset inherited GPU request for dedicated CPU queues.

workloads:
  # List of workloads that are installed on the cluster, auto populated by installer.
  installed: 
    - pretraining_nemotron

  config:
    # Workload specific settings, pairs with metadata.yaml files.
    pretraining_nemotron:
      venv_path: "/lustre/path/to/venv/folder"
      venv_type: "venv"  # Type of virtual environment: 'venv' or 'conda'
      environment:
        ENV_VAR: "value" # Environment variables to set for the workload. (Optional)
