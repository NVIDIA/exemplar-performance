# Setup
general:
  workload: llama2_mlperf
  display_name: llama2-mlperf
  workload_aliases: [llama2_mlperf, llama2-mlperf]
  workload_type: finetune
  framework: megatron_bridge

container:
  images: 
    - 'nvcr.io#nvidia/nemo:26.08.01'

repositories:
  megatron_bridge:
    url: "https://github.com/NVIDIA-NeMo/Megatron-Bridge.git"
    commit: "c86b4e53296bc5ddf63d4024375b4f9d323d5ca5"
  nemo_run:
    url: "https://github.com/NVIDIA-NeMo/Run.git"
    commit: "a960fc61093d0b119110a1272e9c2cb22a6edd91"

downloads:
  huggingface:
    - repo_id: 'meta-llama/Llama-2-70b-hf'
      assets: [config, tokenizer]

setup:
  venv_req: true
  dependencies:
    git:
      megatron_bridge:
        repo_key: megatron_bridge
        install_method:
          type: clone
    pip:
      - package: nemo_run
        repo_key: nemo_run
      # NeMo-Run imports leptonai.api.v1, which leptonai 0.47 removed.
      - 'leptonai==0.27.3'
  tasks:
    - name: checkpoint_download
      cmd: './download_ckpt.sh'
      job_type: srun
      requires_gpus: true


# Run
run:
  launcher_type: 'megatron_bridge'
  launch_script: 'launch.sh'

  gpu_configs:
    gb300:
      model_configs:
        - model_size: '70b'
          dtypes:
            fp8: [4, 8, 72, 512]

    gb200:
      model_configs:
        - model_size: '70b'
          dtypes:
            fp8: [4, 8, 72, 512]
