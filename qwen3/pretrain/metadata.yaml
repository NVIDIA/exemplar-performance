# Setup
general:
  workload: qwen3
  display_name: qwen3
  workload_aliases: [qwen3, qwen-moe]
  workload_type: pretrain
  framework: megatron_bridge

container:
  images:
    - 'nvcr.io#nvidia/nemo:26.06.01'

downloads:
  huggingface:
    - repo_id: 'Qwen/Qwen3-30B-A3B'
    - repo_id: 'Qwen/Qwen3-235B-A22B'

repositories:
  megatron_bridge:
    url: "https://github.com/NVIDIA-NeMo/Megatron-Bridge.git"
    commit: "b50da4c7404caa41793e74ac40d18798844c7b67"
  nemo_run:
    url: "https://github.com/NVIDIA-NeMo/Run.git"
    commit: "211d4b7439c1b5ee401cfbaba1765454ed438ff5"

setup:
  venv_req: true
  dependencies:
    git:
      megatron_bridge:
        repo_key: megatron_bridge
        install_method:
          type: clone
    pip:
      - package: nemo_run
        repo_key: nemo_run
      # NeMo-Run imports leptonai.api.v1, which leptonai 0.47 removed.
      - 'leptonai==0.27.3'



tools:
  nsys: "2025.5.1.121-3638078"


# Run
run:
  launcher_type: 'megatron_bridge'
  launch_script: 'launch.sh'

  gpu_configs:
    gb300:
      model_configs:
        - model_size: '235b'
          dtypes: ['bf16', 'fp8']
          scales: [256,512]
        - model_size: '30b'
          dtypes: ['bf16', 'fp8']
          scales: [8,16,32,64]

    gb200:
      model_configs:
        - model_size: '235b'
          dtypes: ['bf16', 'fp8']
          scales: [256,512]
        - model_size: '30b'
          dtypes: ['bf16', 'fp8']
          scales: [8,16,32,64]

    b300:
      model_configs:
        - model_size: '235b'
          dtypes: ['bf16', 'fp8']
          scales: [256,512]
        - model_size: '30b'
          dtypes: ['bf16', 'fp8']
          scales: [8,16,32,64]

    b200:
      model_configs:
        - model_size: '235b'
          dtypes: ['bf16', 'fp8']
          scales: [256,512]
        - model_size: '30b'
          dtypes: ['bf16', 'fp8']
          scales: [8,16,32,64]

    h100:
      model_configs:
        - model_size: '235b'
          dtypes: ['bf16']
          scales: [256,512]
        - model_size: '30b'
          dtypes: ['bf16']
          scales: [16,32,64]
