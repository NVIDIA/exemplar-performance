base:
  name: "dsv4f-sgl-disagg-gb200-1p1d-dep4-tp4-mtp-hicache"


  identity:
    model:
      repo: deepseek-ai/DeepSeek-V4-Flash-0731
      revision: 7872f01b1d1fe23eabc4c98b48bffcef5a386062
    container:
      image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.5.1

  model:
    path: "deepseek-v4-flash-0731"
    container: "dynamo-sglang-1.5.1"
    precision: "fp4"

  dynamo:
    install: false

  slurm:
    time_limit: "2:00:00"

  health_check:
    max_attempts: 1440
    interval_seconds: 10

  resources:
    gpu_type: gb200
    gpus_per_node: 4
    prefill_nodes: 1
    decode_nodes: 1
    prefill_workers: 1
    decode_workers: 1
    gpus_per_prefill: 4
    gpus_per_decode: 4

  infra:
    etcd_nats_dedicated_node: false
    nats_max_payload_mb: 32

  container_mounts:
    "$LLMB_WORKLOAD/dataset": "/datasets"

  frontend:
    type: dynamo
    nginx_container: nginx-1.27.4
    nginx_session_affinity: true
    nginx_session_affinity_header: X-Dynamo-Session-ID
    enable_multiple_frontends: false
    env:
      PIP_BREAK_SYSTEM_PACKAGES: "1"
    args:
      router-mode: "kv"
      router-session-affinity-ttl-secs: "3600"
      active-decode-blocks-threshold: "None"
      active-prefill-tokens-threshold: "None"
      active-prefill-tokens-threshold-frac: "None"

  backend:
    type: sglang

    prefill_environment:
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "900"
      SGLANG_DSV4_MHC_PREWARM: '1'
      PIP_BREAK_SYSTEM_PACKAGES: '1'
      PYTHONUNBUFFERED: '1'
      SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: '1'
      SGLANG_DG_CACHE_DIR: /configs/deepgemm_cache
      SGLANG_JIT_DEEPGEMM_PRECOMPILE: '1'
      SGLANG_JIT_DEEPGEMM_FAST_WARMUP: '1'
      SGLANG_DEFAULT_THINKING: '1'
      SGLANG_DSV4_REASONING_EFFORT: high
      SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: '1'
      SGLANG_OPT_UNIFIED_CACHE_FREE_OUT_OF_WINDOW_SLOTS: "1"
      SGLANG_OPT_USE_CUSTOM_ALL_REDUCE_V2: '1'
      SGLANG_OPT_USE_DEEPGEMM_MEGA_MOE: '1'
      SGLANG_OPT_DEEPGEMM_MEGA_MOE_USE_FP4_ACTS: '1'
      SGLANG_OPT_DEEPGEMM_MEGA_MOE_USE_MXF4_KIND: '1'
      SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: '9216'
      SGLANG_OPT_USE_ONLINE_COMPRESS: '0'
      NCCL_MNNVL_ENABLE: '1'
      NCCL_CUMEM_ENABLE: '1'
      SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
      MC_FORCE_MNNVL: '1'
      NCCL_TIMEOUT: '100000'
      NCCL_MNNVL_UUID_QUERY_TIMEOUT: '100000'
      SGLANG_OPT_SWA_RELEASE_LEAF_LOCK_AFTER_WINDOW: '1'
      DYN_SKIP_SGLANG_LOG_FORMATTING: '1'
      DYN_LOG: info,dynamo_runtime::pipeline::network::ingress::push_handler=warn
      SGLANG_LOG_FORWARD_ITERS: '1'
      SGLANG_LOG_MS: '1'
      SGLANG_REQUEST_STATE_WAIT_TIMEOUT: '60'
      SGLANG_ENABLE_UNIFIED_RADIX_TREE: '1'

    decode_environment:
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "900"
      SGLANG_DISABLE_DRAFT_EXTEND_CUDA_GRAPH: "1"
      PIP_BREAK_SYSTEM_PACKAGES: '1'
      PYTHONUNBUFFERED: '1'
      SGLANG_DISABLE_TP_MEMORY_INBALANCE_CHECK: '1'
      SGLANG_DG_CACHE_DIR: /configs/deepgemm_cache
      SGLANG_JIT_DEEPGEMM_PRECOMPILE: '1'
      SGLANG_JIT_DEEPGEMM_FAST_WARMUP: '1'
      SGLANG_DEFAULT_THINKING: '1'
      SGLANG_DSV4_REASONING_EFFORT: high
      SGLANG_OPT_SWA_SPLIT_LEAF_ON_INSERT: '1'
      SGLANG_OPT_UNIFIED_CACHE_FREE_OUT_OF_WINDOW_SLOTS: "1"
      SGLANG_OPT_DEEPGEMM_MEGA_MOE: '1'
      SGLANG_OPT_DEEPGEMM_MEGA_MOE_USE_FP4_ACTS: '1'
      SGLANG_OPT_DEEPGEMM_MEGA_MOE_USE_MXF4_KIND: '1'
      SGLANG_OPT_DEEPGEMM_MEGA_MOE_NUM_MAX_TOKENS_PER_RANK: '2048'
      SGLANG_OPT_USE_ONLINE_COMPRESS: '0'
      NCCL_MNNVL_ENABLE: '1'
      NCCL_CUMEM_ENABLE: '1'
      SGLANG_MOONCAKE_CUSTOM_MEM_POOL: 'True'
      MC_FORCE_MNNVL: '1'
      NCCL_TIMEOUT: '100000'
      NCCL_MNNVL_UUID_QUERY_TIMEOUT: '100000'
      SGLANG_OPT_SWA_RELEASE_LEAF_LOCK_AFTER_WINDOW: '1'
      SGLANG_CLIP_MAX_NEW_TOKENS_ESTIMATION: '8'
      DYN_SKIP_SGLANG_LOG_FORMATTING: '1'
      DYN_LOG: info,dynamo_runtime::pipeline::network::ingress::push_handler=warn
      SGLANG_LOG_FORWARD_ITERS: '1'
      SGLANG_LOG_MS: '1'
      SGLANG_REQUEST_STATE_WAIT_TIMEOUT: '60'
      SGLANG_ENABLE_UNIFIED_RADIX_TREE: '1'

    sglang_config:
      prefill:
        host: 0.0.0.0
        served-model-name: deepseek-ai/DeepSeek-V4-Flash-0731
        enable-metrics: true
        model-path: /model/
        trust-remote-code: true
        watchdog-timeout: 86400
        stream-interval: 60
        tp-size: 4
        dp-size: 4
        ep-size: 4
        enable-dp-attention: true
        enable-dp-lm-head: true
        moe-dense-tp-size: 1
        moe-a2a-backend: megamoe
        disaggregation-transfer-backend: mooncake
        disaggregation-mode: prefill
        load-balance-method: total_tokens
        mem-fraction-static: 0.38
        swa-full-tokens-ratio: 0.02
        max-running-requests: 512
        cuda-graph-max-bs: 512
        chunked-prefill-size: 32768
        disable-flashinfer-autotune: true
        model-loader-extra-config: '{"enable_multithread_load":true,"num_threads":8}'
        kv-events-config: '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557"}'
        speculative-algorithm: EAGLE
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        enable-hierarchical-cache: true
        hicache-write-policy: write_back
        hicache-ratio: 1
        hicache-io-backend: direct

      decode:
        host: 0.0.0.0
        served-model-name: deepseek-ai/DeepSeek-V4-Flash-0731
        enable-metrics: true
        model-path: /model/
        trust-remote-code: true
        watchdog-timeout: 86400
        stream-interval: 60
        tp-size: 4
        dp-size: 1
        ep-size: 1
        enable-dp-attention: false
        enable-dp-lm-head: false
        moe-runner-backend: flashinfer_mxfp4
        disaggregation-transfer-backend: mooncake
        disaggregation-mode: decode
        load-balance-method: total_tokens
        mem-fraction-static: 0.75
        swa-full-tokens-ratio: 0.02
        max-running-requests: 512
        cuda-graph-max-bs: 512
        disable-flashinfer-autotune: true
        model-loader-extra-config: '{"enable_multithread_load":true,"num_threads":8}'
        kv-events-config: '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5567"}'
        speculative-algorithm: EAGLE
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4


  sbatch_directives:
    mem: "0"
    cpus-per-task: "144"

  srun_options:
    mem: "0"
    container-remap-root: ""

  benchmark:
    type: "custom"
    container_image: "aiperf-0.12.0"
    command: |
      set -euo pipefail

      for concurrency in 128 256; do
        aiperf profile \
        --url "http://localhost:8000" \
        --model "deepseek-ai/DeepSeek-V4-Flash-0731" \
        --endpoint-type 'chat' \
        --streaming \
        --custom-dataset-type 'weka_trace' \
        --input-file '/datasets/agentic_coding' \
        --num-dataset-entries 267 \
        --max-context-length 1048572 \
        --concurrency "$concurrency" \
        --num-profile-runs 1 \
        --benchmark-duration 1800 \
        --unsafe-override \
        --cache-bust first_turn_prefix \
        --ui 'simple' \
        --random-seed 42 \
        --extra-inputs ignore_eos:true \
        --artifact-dir "/logs/aiperf_${concurrency}"
      done

      config_name="${SLURM_JOB_NAME:?SLURM_JOB_NAME is required}"
      rollup_tmp="$(mktemp /logs/benchmark-rollup.XXXXXX)"
      trap 'rm -f "$rollup_tmp"' EXIT
      printf '%s\n' 'Config,Total GPU Count,Decode GPU Count,Total Working GPU Count,Decode Working GPU Count,Prefill Working GPU Count,Concurrency,Total Token Throughput,Output Token Throughput,Median TTFT,Median TPOT,Median ITL,P90 Decode Running Requests,Output Token Throughput per User,Total Token Throughput per GPU' > "$rollup_tmp"

      for concurrency in 128 256; do
        csv="/logs/aiperf_${concurrency}/profile_export_aiperf.csv"
        awk -F, -v config="$config_name" -v concurrency="$concurrency" '
          { sub(/\r$/, "") }
          FNR == 1 && ($1 != "Metric" || $2 != "avg" || $10 != "p50") {
            print "Invalid AIPerf CSV header: " FILENAME > "/dev/stderr"
            exit 1
          }
          $1 == "Total Token Throughput (tokens/sec)" { total = $2 }
          $1 == "Output Token Throughput (tokens/sec)" { output = $2 }
          $1 == "Output Token Throughput Per User (tokens/sec/user)" { per_user = $10 }
          $1 == "Time to First Token (ms)" { ttft = $10 }
          $1 == "Inter Token Latency (ms)" { itl = $10 }
          END {
            if (total == "" || output == "" || per_user == "" || ttft == "" || itl == "" || itl <= 0) {
              print "Missing required AIPerf metric: " FILENAME > "/dev/stderr"
              exit 1
            }
            printf "%s,8,4,8,4,4,%s,%.3f,%.3f,%.3f,%.3f,%.3f,,%.3f,%.3f\n", config, concurrency, total, output, ttft, itl, itl, per_user, total / 8
          }
        ' "$csv" >> "$rollup_tmp"
      done

      mv "$rollup_tmp" /logs/benchmark-rollup.csv
      trap - EXIT

      for concurrency in 128 256; do
        csv="/logs/aiperf_${concurrency}/profile_export_aiperf.csv"
        if ! awk -F, '
          { sub(/\r$/, "") }
          $1 == "Request Error Rate" || $1 == "Request Error Rate (%)" { rate = $2; has_rate = 1 }
          $1 == "Request Count" { requests = $2; has_requests = 1 }
          $1 == "Error Request Count" { errors = $2; has_errors = 1 }
          END {
            number = "^[0-9]+([.][0-9]+)?([eE][+-]?[0-9]+)?$"
            if (has_rate) {
              if (rate !~ number) exit 1
              error_rate = rate + 0
            } else {
              if (!has_requests || requests !~ number || (has_errors && errors !~ number)) exit 1
              if (requests <= 0) exit 1
              error_rate = 100 * errors / requests
            }
            if (error_rate > 3) exit 1
          }
        ' "$csv"; then
          echo "Benchmark Failed"
          exit 1
        fi
      done
      echo "Benchmark Succeeded"

override_validated: {}
