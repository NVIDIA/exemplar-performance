name: "kimi_k26_nvfp4_trtllm_dynamo_isl32k_osl4k_high_pareto_1024_ctx4dep8_gen1dep16"

identity:
  model:
    repo: "nvidia/Kimi-K2.6-NVFP4"
    revision: "2fd3a800dedd098b8327eb49e93ebc75f85da19f"
  container:
    image: "nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.1.0-dev.2"

# Dedicated 1024-concurrency run:
# ctx4dep8 prefill + gen1dep16 decode
model:
  path: "kimi26-nvfp4"
  container: "trtllm-runtime-1.1.0-dev.2"
  precision: "fp4"

resources:
  gpu_type: "gb200"

  # Prefill: 4 workers x TP8 = 32 GPUs = 8 nodes
  prefill_nodes: 8
  prefill_workers: 4
  gpus_per_prefill: 8

  # Decode: 1 worker x TP16 = 16 GPUs = 4 nodes
  decode_workers: 1
  decode_nodes: 4
  gpus_per_decode: 16

  gpus_per_node: 4

backend:
  type: trtllm

  prefill_environment:
    ENROOT_ALLOW_DEV: "yes"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    TLLM_LOG_LEVEL: "INFO"
    TRTLLM_ENABLE_PDL: "1"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"

  decode_environment:
    ENROOT_ALLOW_DEV: "yes"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TLLM_AUTOTUNER_LOG_LEVEL_DEBUG_TO_INFO: "1"
    TLLM_LOG_LEVEL: "INFO"
    TRTLLM_ENABLE_PDL: "1"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"

  trtllm_config:
    prefill:
      tensor_parallel_size: 8
      moe_expert_parallel_size: 8
      pipeline_parallel_size: 1
      enable_attention_dp: false
      disable_overlap_scheduler: true
      trust_remote_code: true
      max_batch_size: 1
      max_num_tokens: 32768
      max_seq_len: 32808
      print_iter_log: true
      cuda_graph_config: null
      moe_config:
        backend: TRTLLM
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.4
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 32768

    decode:
      tensor_parallel_size: 16
      moe_expert_parallel_size: 16
      pipeline_parallel_size: 1
      enable_attention_dp: true
      enable_lm_head_tp_in_adp: false
      trust_remote_code: true
      max_batch_size: 64
      max_num_tokens: 64
      max_seq_len: 36904
      print_iter_log: true
      stream_interval: 100
      num_postprocess_workers: 4
      cuda_graph_config:
        enable_padding: true
        batch_sizes:
          - 1
          - 2
          - 4
          - 8
          - 16
          - 24
          - 32
          - 40
          - 48
          - 56
          - 64
      moe_config:
        backend: TRTLLM
        use_low_precision_moe_combine: true
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.8
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 65536
      nvfp4_gemm_config:
        allowed_backends:
          - cutlass
          - cublaslt
          - cutedsl
          - cuda_core

benchmark:
  type: "sa-bench"
  isl: 32768
  osl: 4096
  concurrencies: "1024"
  req_rate: "inf"

frontend:
  type: "dynamo"
  enable_multiple_frontends: false

health_check:
  max_attempts: 360
  interval_seconds: 10

dynamo:
  install: false
