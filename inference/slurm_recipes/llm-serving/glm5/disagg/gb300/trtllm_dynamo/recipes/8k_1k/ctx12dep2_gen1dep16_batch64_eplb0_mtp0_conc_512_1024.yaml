name: "glm5_nvfp4_ISL8K_OSL1K_ctx12dep2_gen1dep16_batch64_eplb0_mtp0_conc512_1024"

identity:
  model:
    repo: "nvidia/GLM-5-NVFP4"
    revision: "dc54ff55a7e9e71b85db953d8bc22eca894b44c6"
  container:
    image: "nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:1.1.0-dev.3"

# ctx: 12 prefill workers, TP2/EP2
# gen: 1 decode worker, TP16/EP16, enable_attention_dp=true, max_batch=64
# conc group: 512, 1024

model:
  path: "glm5-nvfp4"
  container: "trtllm-runtime-1.1.0-dev.3"
  precision: "fp4"

setup_script: "install-trtllm-pip.sh"

resources:
  gpu_type: "gb300"

  prefill_nodes: 6
  prefill_workers: 12
  gpus_per_prefill: 2

  decode_workers: 1
  decode_nodes: 4
  gpus_per_decode: 16

  gpus_per_node: 4

backend:
  type: trtllm

  prefill_environment:
    ENROOT_ALLOW_DEV: "yes"
    MIMALLOC_PURGE_DELAY: "0"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TLLM_LOG_LEVEL: "INFO"
    TRTLLM_ENABLE_PDL: "1"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"

  decode_environment:
    ENROOT_ALLOW_DEV: "yes"
    MIMALLOC_PURGE_DELAY: "0"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TLLM_LOG_LEVEL: "INFO"
    TRTLLM_ENABLE_PDL: "1"
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"

  trtllm_config:
    prefill:
      tensor_parallel_size: 2
      moe_expert_parallel_size: 2
      pipeline_parallel_size: 1
      enable_attention_dp: true
      disable_overlap_scheduler: true
      trust_remote_code: true
      custom_tokenizer: "glm_moe_dsa"
      max_batch_size: 2
      max_num_tokens: 16640
      max_seq_len: 8232
      print_iter_log: true
      cuda_graph_config: null
      moe_config:
        backend: CUTEDSL
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.6
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 16384

    decode:
      tensor_parallel_size: 16
      moe_expert_parallel_size: 16
      pipeline_parallel_size: 1
      enable_attention_dp: true
      enable_lm_head_tp_in_adp: false
      trust_remote_code: true
      custom_tokenizer: "glm_moe_dsa"
      max_batch_size: 64
      max_num_tokens: 64
      max_seq_len: 9256
      print_iter_log: true
      stream_interval: 100
      num_postprocess_workers: 4
      cuda_graph_config:
        enable_padding: true
        batch_sizes:
          - 1
          - 2
          - 4
          - 8
          - 16
          - 32
          - 48
          - 64
      moe_config:
        backend: CUTEDSL
        use_low_precision_moe_combine: true
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.8
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 16384
      nvfp4_gemm_config:
        allowed_backends:
          - cutlass
          - cublaslt
          - cutedsl
          - cuda_core

benchmark:
  type: "sa-bench"
  isl: 8192
  osl: 1024
  concurrencies: "512x1024"
  req_rate: "inf"
  num_prompts_mult: 16
  custom_tokenizer: "glm_moe_dsa"
  use_chat_template: true

frontend:
  type: "dynamo"
  enable_multiple_frontends: false

health_check:
  max_attempts: 360
  interval_seconds: 10

dynamo:
  install: false
