# Nemotron-3 Ultra NVFP4 on GB300, 8K/64K: 1 prefill + 3 decode workers, TP4/EP4, one node per worker.
base:
  name: nemotron3-ultra-gb300-nvfp4-8k64k-1p3d

  model:
    path: nemotron3-ultra-nvfp4
    container: sglang-runtime-1.4.0-inkling-dev.1
    precision: nvfp4

  identity:
    model:
      repo: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-NVFP4
      revision: 183968f87ae4cedce3039313cac1fd43d112c578
    container:
      image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.4.0-inkling-dev.1
    frameworks:
      dynamo: 1.3.0

  slurm:
    time_limit: "10:00:00"

  resources:
    gpu_type: gb300
    gpus_per_node: 4
    prefill_nodes: 1
    prefill_workers: 1
    decode_nodes: 3
    decode_workers: 3

  # Single Dynamo frontend.
  frontend:
    type: dynamo
    enable_multiple_frontends: false

  dynamo:
    version: 1.3.0
    install: false
    request_plane: nats

  backend:
    prefill_environment:
      UCX_TLS: "rc,cuda_copy,cuda_ipc,self,sm"
      UCX_NET_DEVICES: "all"
      UCX_RCACHE_MAX_SIZE: "8G"
      UCX_RCACHE_MAX_REGIONS: "4096"
      SGLANG_DISABLE_DEEP_GEMM: "1"
      NVIDIA_TF32_OVERRIDE: "1"
      SAFETENSORS_FAST_GPU: "1"
      PYTHONUNBUFFERED: "1"
      DYN_SKIP_SGLANG_LOG_FORMATTING: "1"
      SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
      SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
      DYN_REQUEST_PLANE: "nats"
      UCX_RNDV_SCHEME: "get_zcopy"

    decode_environment:
      UCX_TLS: "rc,cuda_copy,cuda_ipc,self,sm"
      UCX_NET_DEVICES: "all"
      UCX_RCACHE_MAX_SIZE: "8G"
      UCX_RCACHE_MAX_REGIONS: "4096"
      SGLANG_DISABLE_DEEP_GEMM: "1"
      NVIDIA_TF32_OVERRIDE: "1"
      SAFETENSORS_FAST_GPU: "1"
      PYTHONUNBUFFERED: "1"
      DYN_SKIP_SGLANG_LOG_FORMATTING: "1"
      SGLANG_DISAGGREGATION_HEARTBEAT_MAX_FAILURE: "100000"
      SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: "100000"
      SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "100000"
      DYN_REQUEST_PLANE: "nats"
      UCX_RNDV_SCHEME: "get_zcopy"

    sglang_config:
      prefill:
        served-model-name: nemotron-3-ultra
        disaggregation-transfer-backend: nixl
        context-length: 131072
        tensor-parallel-size: 4
        data-parallel-size: 1
        expert-parallel-size: 4
        trust-remote-code: true
        kv-cache-dtype: fp8_e4m3
        moe-runner-backend: flashinfer_trtllm
        fp8-gemm-backend: triton
        mamba-scheduler-strategy: no_buffer
        disable-radix-cache: true
        disable-piecewise-cuda-graph: true
        disable-custom-all-reduce: true
        reasoning-parser: nemotron_3
        tool-call-parser: qwen3_coder
        stream-interval: 20
        model-loader-extra-config: '{"enable_multithread_load": true}'
        weight-loader-prefetch-checkpoints: true
        attention-backend: trtllm_mha
        chunked-prefill-size: 8192
        max-prefill-tokens: 8192
        mem-fraction-static: 0.5

      decode:
        served-model-name: nemotron-3-ultra
        disaggregation-transfer-backend: nixl
        context-length: 131072
        tensor-parallel-size: 4
        data-parallel-size: 1
        expert-parallel-size: 4
        trust-remote-code: true
        skip-tokenizer-init: true
        kv-cache-dtype: fp8_e4m3
        moe-runner-backend: flashinfer_trtllm
        fp8-gemm-backend: triton
        mamba-scheduler-strategy: no_buffer
        disable-radix-cache: true
        disable-piecewise-cuda-graph: true
        disable-custom-all-reduce: true
        reasoning-parser: nemotron_3
        tool-call-parser: qwen3_coder
        stream-interval: 30
        model-loader-extra-config: '{"enable_multithread_load": true}'
        weight-loader-prefetch-checkpoints: true
        attention-backend: trtllm_mha
        mem-fraction-static: 0.6
        max-running-requests: 64
        cuda-graph-max-bs-decode: 64

  health_check:
    max_attempts: 360
    interval_seconds: 10

  # Fixed ISL/OSL; 2 x concurrency measured requests and 2 x concurrency warmup requests per concurrency.
  benchmark:
    type: sa-bench
    isl: 8192
    osl: 65536
    concurrencies: [1, 4, 8, 16, 32]
    req_rate: inf
    num_prompts_mult: 2
    num_warmup_mult: 2
    random_range_ratio: 1.0
    use_chat_template: false

override_validated: {}
