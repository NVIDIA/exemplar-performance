# Per-scenario BASELINE cluster requirements. scripts/preflight.py merges a recipe's
# envelope.requires ON TOP of the baseline for its scenario. Cluster-specific values (namespace, GPU
# product label, actual PVC/secret names) come from the cluster-profile..

llm-perf:
  gpu:
    count: 8                    # a schedulable N-GPU node of the recipe's gpu_type
  storage: [ MODEL_CACHE_PVC ]  # RWX model/dataset cache, Bound
  secrets: [ IMAGE_PULL_SECRET ]
  dcgm: optional                # for GPU-utilization telemetry

# agentic (TaskTrace): a CPU-only Job running the task image; needs the cache PVC and the pull secret.
agentic:
  storage: [ MODEL_CACHE_PVC ]  # RWX cache holding tasktrace/ (trajectories, bin, venv), Bound
  secrets: [ IMAGE_PULL_SECRET ]
  dcgm: none
