# Phase-2 in-cluster resource governor — OBSERVE / REPORT-ONLY namespaced manifests.
#
# The automated orphan-sweep SAFETY NET, deployed in report-only mode: it computes what it WOULD reap/halt in
# enforce mode and writes that to the ConfigMap `governor-observe-report` + its pod logs — and mutates NOTHING
# (GOVERNOR_MODE=observe forces MUTATE=0 in reconcile/governor_reconcile.sh; no scale/delete/patch is ever
# issued). Applied ONCE per namespace with plain `kubectl apply` (envsubst-resolved ${VARS}) by
# serving/governor/deploy-observe.sh, which prepends the reconcile ConfigMap `llmb-governor-script`.
#
# Vanilla k8s, on-philosophy: a plain CronJob + a namespace-scoped Role (NO CRD, NO ClusterRole, NO
# cluster-admin). The observe Role is DELIBERATELY reduced vs the enforce Role (templates/governor.yaml):
#   * get/list/watch on deployments, jobs, pods   — read-only enumeration + foreign classification
#   * get/create/update on the ONE report ConfigMap — publish governor-observe-report (no patch/apply)
#   * NO delete, NO patch, NO deployments/scale     — observe mode is structurally incapable of reaping.
# Grant delete/patch/scale ONLY when flipping to enforce (templates/governor.yaml).
#
# Required vars:  NAMESPACE, IMAGE_PULL_SECRET.
# Optional (defaults applied by deploy-observe.sh, NOT envsubst — plain ${VAR} refs only here):
#   GOVERNOR_IMAGE (alpine/k8s:1.34.1), GOVERNOR_OBSERVE_SCHEDULE ("*/15 * * * *"),
#   OBSERVE_REPORT_CM (governor-observe-report), STALL_THRESHOLD (1800), HEARTBEAT_DEAD (300),
#   STUCK_THRESHOLD (900), TIMEOUT_MULT (2), MIN_KILL_SECONDS (3600).
#
# No control PVC: observe mounts an emptyDir at /control (the stall/timeout scan is inert without the Phase-1
# RWX control substrate — a no-op directory scan), so the safety net deploys even where Phase-1 is not wired.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: llmb-governor-observe
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/managed-by: llmb-recipe
    app.kubernetes.io/component: governor-observe
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llmb-governor-observe
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/managed-by: llmb-recipe
    app.kubernetes.io/component: governor-observe
rules:
  # READ-ONLY enumeration of our resources + foreign classification (resp. 1/2/3/4 detection, observe-only).
  - { apiGroups: ["apps"], resources: ["deployments"], verbs: ["get", "list", "watch"] }
  - { apiGroups: ["batch"], resources: ["jobs"],        verbs: ["get", "list", "watch"] }
  - { apiGroups: [""],      resources: ["pods"],        verbs: ["get", "list", "watch"] }
  # Publish the ONE observe report ConfigMap (get -> create-if-absent, else replace/update). NO patch/apply.
  - { apiGroups: [""],      resources: ["configmaps"],  verbs: ["get", "create", "update"] }
  # NOTE: NO delete, NO patch, NO deployments/scale — observe mode is structurally reap-incapable (§ safety).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llmb-governor-observe
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/managed-by: llmb-recipe
    app.kubernetes.io/component: governor-observe
subjects:
  - { kind: ServiceAccount, name: llmb-governor-observe, namespace: ${NAMESPACE} }
roleRef:
  { kind: Role, name: llmb-governor-observe, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: llmb-governor-observe
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/managed-by: llmb-recipe
    app.kubernetes.io/component: governor-observe
spec:
  schedule: "${GOVERNOR_OBSERVE_SCHEDULE}"   # every 15 min — report-only, no urgency
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240
      backoffLimit: 1
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/managed-by: llmb-recipe
            app.kubernetes.io/component: governor-observe
        spec:
          serviceAccountName: llmb-governor-observe
          restartPolicy: OnFailure
          imagePullSecrets: [{ name: ${IMAGE_PULL_SECRET} }]
          # A tiny read-only kubectl pod (no GPU): tolerate ALL taints so it schedules on any node the cluster
          # offers, without forcing it onto a GPU node (it requests none).
          tolerations:
            - { operator: Exists }
          containers:
            - name: governor
              image: ${GOVERNOR_IMAGE}   # sh + kubectl + jq; NOT bitnami/distroless
              command: ["/bin/sh", "-c", "/scripts/governor_reconcile.sh"]
              resources:
                requests: { cpu: "50m", memory: "64Mi" }
                limits:   { cpu: "500m", memory: "256Mi" }
              env:
                - { name: NAMESPACE,        value: "${NAMESPACE}" }
                - { name: GOVERNOR_MODE,    value: "observe" }             # REPORT-ONLY: zero mutations
                - { name: OBSERVE_REPORT_CM, value: "${OBSERVE_REPORT_CM}" }
                - { name: STALL_THRESHOLD,  value: "${STALL_THRESHOLD}" }
                - { name: HEARTBEAT_DEAD,   value: "${HEARTBEAT_DEAD}" }
                - { name: STUCK_THRESHOLD,  value: "${STUCK_THRESHOLD}" }
                - { name: TIMEOUT_MULT,     value: "${TIMEOUT_MULT}" }
                - { name: MIN_KILL_SECONDS, value: "${MIN_KILL_SECONDS}" }
              volumeMounts:
                - { name: control, mountPath: /control }   # emptyDir — no Phase-1 control PVC dependency
                - { name: script,  mountPath: /scripts }
          volumes:
            - { name: control, emptyDir: {} }
            - { name: script,  configMap: { name: llmb-governor-script, defaultMode: 0755 } }
