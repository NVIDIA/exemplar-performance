# Disaggregated 1-prefill/1-decode benchmark example.
# Changes: for N in 128 256 512 1024 (fixed list); RUN_ID=disagg-1m;
# SERVER_URL=frontend:8000; SERVER_RUNTIME=dynamo (skip vLLM /metrics asserts);
# full-trace + --request-timeout-seconds 3600 (already baked in the script).
# total_gpus=16 -> pass --gpu-count 16 to scripts/aggregate_metrics.py post-run.
{
  "apiVersion": "batch/v1",
  "kind": "Job",
  "metadata": {
    "name": "llmb-bench-disagg-1m",
    "namespace": "$NAMESPACE",
    "labels": {
      "app.kubernetes.io/component": "bench",
      "llmb.nvidia.com/owner": "$OWNER",
      "llmb.nvidia.com/run-id": "disagg-1m"
    }
  },
  "spec": {
    "backoffLimit": 0,
    "completions": 1,
    "parallelism": 1,
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/component": "bench",
          "llmb.nvidia.com/run-id": "disagg-1m"
        }
      },
      "spec": {
        "containers": [
          {
            "args": [
              "set -eu\n\n# ------- Bootstrap: kubectl, git, curl, aiperf ----------------\necho \"[$(date -u +%H:%M:%S)] Installing OS deps + kubectl + aiperf...\"\napt-get update -qq\n# build-essential + python3-dev are needed because some AIPerf\n# transitive deps (notably `crick`) ship no aarch64 wheel on\n# PyPI and pip falls back to a source build. Cost on amd64\n# where wheels exist: ~20s extra apt install. Keeps the bench\n# portable to clusters whose only user-schedulable nodes are\n# arm64 (e.g. an arm64-only cluster, where the few amd64 nodes are\n# all tainted dedicated=system-workload).\napt-get install -y -qq --no-install-recommends \\\n  curl git ca-certificates build-essential python3-dev\nARCH=$(uname -m)\ncase \"$ARCH\" in\n  x86_64)  KARCH=amd64 ;;\n  aarch64) KARCH=arm64 ;;\n  *) echo \"Unsupported arch: $ARCH\"; exit 1 ;;\nesac\ncurl -fsSL -o /usr/local/bin/kubectl \\\n  \"https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${KARCH}/kubectl\"\nchmod +x /usr/local/bin/kubectl\npip install --no-cache-dir --quiet \"git+https://github.com/ai-dynamo/aiperf.git@fef78a96ee30df4c135a9e5691b48e50ba91133d\"\necho \"[$(date -u +%H:%M:%S)] Bootstrap complete.\"\naiperf --version || true\nkubectl version --client=true || true\n\nkube() {\n  local server ca token\n  server=\"https://${KUBERNETES_SERVICE_HOST:-kubernetes.default.svc}:${KUBERNETES_SERVICE_PORT:-443}\"\n  ca=\"/var/run/secrets/kubernetes.io/serviceaccount/ca.crt\"\n  token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)\n  kubectl --server=\"$server\" --certificate-authority=\"$ca\" --token=\"$token\" \"$@\"\n}\n\n# ------- Wait for server to be reachable ----------------------\necho \"[$(date -u +%H:%M:%S)] Waiting for $SERVER_URL/health ...\"\nATTEMPTS=0\nMAX_ATTEMPTS=120  # 10 min\nuntil curl -fsS --connect-timeout 5 --max-time 10 \"$SERVER_URL/health\" >/dev/null 2>&1; do\n  ATTEMPTS=$((ATTEMPTS + 1))\n  if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then\n    echo \"ERROR: server $SERVER_URL/health not ready after $((MAX_ATTEMPTS * 5))s\"\n    exit 1\n  fi\n  sleep 5\ndone\necho \"[$(date -u +%H:%M:%S)] Server is healthy.\"\n\n# ------- Verify model is loaded -------------------------------\necho \"[$(date -u +%H:%M:%S)] Listing models at $SERVER_URL/v1/models...\"\nMODELS_JSON=$(curl -fsS \"$SERVER_URL/v1/models\" || true)\nprintf '%s\\n' \"$MODELS_JSON\"\necho\nMODEL_LIST_JSON=\"$MODELS_JSON\" python3 - <<'PY'\nimport json\nimport os\nimport sys\n\ntarget = os.environ.get(\"AIPERF_MODEL_ID\", \"\")\nraw = os.environ.get(\"MODEL_LIST_JSON\", \"\")\ntry:\n    data = json.loads(raw)\n    ids = {\n        item.get(\"id\")\n        for item in data.get(\"data\", [])\n        if isinstance(item, dict) and item.get(\"id\")\n    }\nexcept Exception as exc:\n    print(f\"FATAL: could not parse /v1/models response: {exc}\", file=sys.stderr)\n    raise SystemExit(66)\nif target not in ids:\n    print(\n        f\"FATAL: AIPerf model {target!r} is not served; available={sorted(ids)!r}\",\n        file=sys.stderr,\n    )\n    raise SystemExit(66)\nprint(f\"AIPerf will request served model: {target}\")\nPY\necho \"AIPerf tokenizer source: $AIPERF_TOKENIZER_ID\"\n\nsmoke_test_model() {\n  local out=\"${1:-/tmp/aiperf_smoke_response.json}\"\n  local body http\n  body=$(python3 -c 'import json, os; print(json.dumps({\"model\": os.environ[\"AIPERF_MODEL_ID\"], \"messages\": [{\"role\": \"user\", \"content\": \"Reply with exactly: ok\"}], \"max_tokens\": 1, \"temperature\": 0, \"stream\": False}))')\n  echo \"[$(date -u +%H:%M:%S)] Smoke-testing chat completion with model=$AIPERF_MODEL_ID ...\"\n  http=$(curl -sS --max-time 300 -o \"$out\" -w '%{http_code}' \\\n    -H 'Content-Type: application/json' \\\n    \"$SERVER_URL/v1/chat/completions\" \\\n    -d \"$body\" || true)\n  SMOKE_HTTP=\"$http\" python3 - \"$out\" <<'PY'\nimport json\nimport os\nimport sys\n\npath = sys.argv[1]\nraw_code = os.environ.get(\"SMOKE_HTTP\", \"\")\ntry:\n    code = int(raw_code)\nexcept ValueError:\n    print(f\"FATAL: smoke request did not return an HTTP status: {raw_code!r}\", file=sys.stderr)\n    raise SystemExit(67)\ntry:\n    with open(path) as f:\n        data = json.load(f)\nexcept Exception as exc:\n    print(f\"FATAL: smoke response is not valid JSON: {exc}\", file=sys.stderr)\n    raise SystemExit(67)\nif code < 200 or code >= 300:\n    print(f\"FATAL: smoke request failed HTTP {code}: {data}\", file=sys.stderr)\n    raise SystemExit(67)\nif isinstance(data, dict) and data.get(\"error\"):\n    print(f\"FATAL: smoke request returned API error: {data['error']}\", file=sys.stderr)\n    raise SystemExit(67)\nchoices = data.get(\"choices\") if isinstance(data, dict) else None\nif not isinstance(choices, list) or not choices:\n    print(f\"FATAL: smoke response missing choices: {data}\", file=sys.stderr)\n    raise SystemExit(67)\nprint(f\"Smoke request passed HTTP {code}.\")\nPY\n}\n\nsmoke_test_large_context() {\n  local out=\"${1:-/tmp/aiperf_large_context_smoke.json}\"\n  local tokens=\"${PRE_SWEEP_SMOKE_PROMPT_TOKENS:-0}\"\n  local timeout=\"${PRE_SWEEP_SMOKE_TIMEOUT_SECONDS:-1200}\"\n  if [ -z \"$tokens\" ] || [ \"$tokens\" = \"0\" ]; then\n    echo \"[$(date -u +%H:%M:%S)] Large-context smoke disabled.\"\n    return 0\n  fi\n  echo \"[$(date -u +%H:%M:%S)] Smoke-testing /v1/completions with model=$AIPERF_MODEL_ID prompt_tokens_target=$tokens ...\"\n  SERVER_URL=\"$SERVER_URL\" \\\n  AIPERF_MODEL_ID=\"$AIPERF_MODEL_ID\" \\\n  SMOKE_PROMPT_TOKENS=\"$tokens\" \\\n  SMOKE_TIMEOUT_SECONDS=\"$timeout\" \\\n  SMOKE_OUT=\"$out\" \\\n  python3 - <<'PY'\nimport json\nimport os\nimport sys\nimport time\nimport urllib.error\nimport urllib.request\n\nserver = os.environ[\"SERVER_URL\"].rstrip(\"/\")\nmodel = os.environ[\"AIPERF_MODEL_ID\"]\ntokens = int(os.environ[\"SMOKE_PROMPT_TOKENS\"])\ntimeout = float(os.environ.get(\"SMOKE_TIMEOUT_SECONDS\") or 1200)\nout = os.environ[\"SMOKE_OUT\"]\nprompt = \" banana\" * tokens\nbody = json.dumps({\n    \"model\": model,\n    \"prompt\": prompt,\n    \"max_tokens\": 1,\n    \"temperature\": 0,\n}).encode(\"utf-8\")\nreq = urllib.request.Request(\n    f\"{server}/v1/completions\",\n    data=body,\n    headers={\"Content-Type\": \"application/json\"},\n    method=\"POST\",\n)\nstarted = time.time()\ntry:\n    with urllib.request.urlopen(req, timeout=timeout) as resp:\n        raw = resp.read().decode(\"utf-8\", errors=\"replace\")\n        data = json.loads(raw)\n        summary = {\n            \"http_status\": resp.status,\n            \"elapsed_sec\": round(time.time() - started, 1),\n            \"target_prompt_tokens\": tokens,\n            \"usage\": data.get(\"usage\") if isinstance(data, dict) else None,\n            \"finish_reason\": (data.get(\"choices\") or [{}])[0].get(\"finish_reason\")\n            if isinstance(data, dict)\n            else None,\n        }\nexcept urllib.error.HTTPError as exc:\n    summary = {\n        \"http_status\": exc.code,\n        \"elapsed_sec\": round(time.time() - started, 1),\n        \"target_prompt_tokens\": tokens,\n        \"body\": exc.read(4000).decode(\"utf-8\", errors=\"replace\"),\n    }\n    print(f\"FATAL: large-context smoke failed HTTP {exc.code}: {summary['body']}\", file=sys.stderr)\n    with open(out, \"w\") as f:\n        json.dump(summary, f, indent=2)\n    raise SystemExit(67)\nexcept Exception as exc:\n    summary = {\n        \"exception\": type(exc).__name__,\n        \"error\": str(exc),\n        \"elapsed_sec\": round(time.time() - started, 1),\n        \"target_prompt_tokens\": tokens,\n    }\n    print(f\"FATAL: large-context smoke failed: {type(exc).__name__}: {exc}\", file=sys.stderr)\n    with open(out, \"w\") as f:\n        json.dump(summary, f, indent=2)\n    raise SystemExit(67)\nif summary.get(\"http_status\") != 200:\n    print(f\"FATAL: large-context smoke returned HTTP {summary.get('http_status')}: {summary}\", file=sys.stderr)\n    with open(out, \"w\") as f:\n        json.dump(summary, f, indent=2)\n    raise SystemExit(67)\nwith open(out, \"w\") as f:\n    json.dump(summary, f, indent=2)\nprint(f\"Large-context smoke passed HTTP 200: {json.dumps(summary, sort_keys=True)}\")\nPY\n}\n\necho \"[$(date -u +%H:%M:%S)] Checking dataset: type=mooncake_trace path=$DATASET_PATH\"\nif [ ! -e \"$DATASET_PATH\" ]; then\n  echo \"FATAL: dataset path does not exist: $DATASET_PATH\" >&2\n  echo \"Generate/place the dataset on the shared cache before launching the bench Job.\" >&2\n  exit 65\nfi\nif [ \"mooncake_trace\" = \"mooncake_trace\" ] && [ ! -f \"$DATASET_PATH\" ]; then\n  echo \"FATAL: mooncake_trace expects a JSONL file, got non-file path: $DATASET_PATH\" >&2\n  exit 65\nfi\n\n# ------- Record server pod identity (sweep start) -------------\n# Select containerStatuses by name=\"sglang\" rather than index\n# [0]: if the SGLang Pod ever sprouts a sidecar (istio-proxy,\n# log forwarder, etc.) the array order is implementation\n# defined and [0] could be the sidecar's status \u2014 restart\n# count would then be unrelated to the model server.\nget_server_id() {\n  kube -n \"$NAMESPACE\" get pod -l \"$SERVER_LABEL_SELECTOR\" \\\n    --field-selector=status.phase=Running \\\n    -o jsonpath='{.items[0].metadata.uid}|{.items[0].status.containerStatuses[?(@.name==\"sglang\")].restartCount}' \\\n    2>/dev/null || echo \"unknown|0\"\n}\n# Resolve the (single) running server Pod name for kubectl exec into.\nresolve_server_pod() {\n  kube -n \"$NAMESPACE\" get pod -l \"$SERVER_LABEL_SELECTOR\" \\\n    --field-selector=status.phase=Running -o name 2>/dev/null \\\n    | head -n1 | sed 's|^pod/||'\n}\n\n# Time-series scrape loop. Runs in the background during each\n# concurrency step; killed when aiperf exits. Two streams:\n#   - server_metrics_timeseries/<unix>.prom: server /metrics\n#     snapshots, one per tick. Used for SGLang HiCache or vLLM\n#     prefix-cache curves, generation throughput, and queue depth.\n#   - gpu_stats.csv: nvidia-smi rows tagged with our wallclock,\n#     one row per GPU per tick. Used for GPU util/mem/power\n#     time-series in the HTML dashboard.\n# Tick interval defaults to 10s and is tunable via the\n# SCRAPE_INTERVAL env var on the Job. Both streams are\n# best-effort and never fail the bench.\nSERVER_POD=\"\"\nscrape_tick() {\n  local out=\"$1\"\n  local ts iso\n  ts=$(date -u +%s)\n  iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)\n  curl -fsS --max-time 8 \"$SERVER_URL/metrics\" \\\n    > \"$out/server_metrics_timeseries/${ts}.prom\" 2>/dev/null || true\n  if [ -n \"$SERVER_POD\" ]; then\n    # `--request-timeout=15s` bounds the kubectl-exec arm so\n    # a wedged API server can't hang a tick (and, in turn,\n    # the scrape loop) indefinitely. The matching curl arm\n    # is already capped at --max-time 8.\n    kube --request-timeout=15s -n \"$NAMESPACE\" exec \\\n      \"$SERVER_POD\" -c sglang -- \\\n      nvidia-smi \\\n        --query-gpu=index,timestamp,utilization.gpu,memory.used,memory.total,power.draw,clocks.sm \\\n        --format=csv,noheader,nounits 2>/dev/null \\\n      | awk -v iso=\"$iso\" 'NF { print iso \",\" $0 }' \\\n      >> \"$out/gpu_stats.csv\" || true\n  fi\n}\nscrape_loop() {\n  # Process-group cleanup. When the parent kills this\n  # background subshell (via `kill $SCRAPE_PID` after\n  # aiperf exits), the in-flight `kubectl exec` child\n  # would otherwise reparent to PID 1 and leak. Trapping\n  # EXIT here ensures the subshell's whole process group\n  # dies together. Combined with the per-exec\n  # `--request-timeout=15s` above, the scrape loop has\n  # both a soft (per-tick) and hard (loop-exit) cleanup.\n  trap 'kill 0 2>/dev/null || true' EXIT\n  local out=\"$1\"\n  local interval=\"${SCRAPE_INTERVAL:-10}\"\n  mkdir -p \"$out/server_metrics_timeseries\"\n  # CSV header (the awk above prepends wallclock_iso to nvidia-smi's\n  # 7 fields). Write once per step so re-runs start clean.\n  printf 'wallclock_iso,gpu_index,timestamp,utilization_gpu_pct,memory_used_mib,memory_total_mib,power_draw_w,clocks_sm_mhz\\n' \\\n    > \"$out/gpu_stats.csv\"\n  while :; do\n    scrape_tick \"$out\"\n    sleep \"$interval\"\n  done\n}\n\njson_field() {\n  local file=\"$1\"\n  local field=\"$2\"\n  python3 - \"$file\" \"$field\" <<'PY'\nimport json\nimport sys\n\nwith open(sys.argv[1]) as f:\n    data = json.load(f)\nvalue = data.get(sys.argv[2])\nif value is None:\n    raise SystemExit(0)\nif isinstance(value, bool):\n    print(\"true\" if value else \"false\")\nelse:\n    print(value)\nPY\n}\n\nclassify_step() {\n  local out=\"$1\"\n  local n=\"$2\"\n  local phase=\"$3\"\n  local aiperf_rc=\"$4\"\n  STEP_CONCURRENCY=\"$n\" STEP_PHASE=\"$phase\" AIPERF_RC=\"$aiperf_rc\" \\\n    python3 - \"$out/logs/aiperf/profile_export_aiperf.json\" <<'PY'\nimport json\nimport os\nimport sys\n\npath = sys.argv[1]\nstat = os.environ.get(\"STOP_STAT\", \"p50\")\nttft_limit = float(os.environ.get(\"TTFT_LIMIT_MS\", \"10000\"))\ntpot_limit = float(os.environ.get(\"TPOT_LIMIT_MS\", \"100\"))\nrc = int(os.environ.get(\"AIPERF_RC\", \"0\"))\nresult = {\n    \"phase\": os.environ.get(\"STEP_PHASE\", \"\"),\n    \"concurrency\": int(os.environ.get(\"STEP_CONCURRENCY\", \"0\")),\n    \"aiperf_exit\": rc,\n    \"stop_stat\": stat,\n    \"ttft_limit_ms\": ttft_limit,\n    \"tpot_limit_ms\": tpot_limit,\n    \"parse_ok\": False,\n    \"passed\": False,\n    \"stop_reason\": \"unparseable_metrics\",\n    \"breaches\": [],\n}\n\ndef metric(data, key):\n    node = data.get(key)\n    if not isinstance(node, dict):\n        return None\n    value = node.get(stat)\n    try:\n        return float(value)\n    except (TypeError, ValueError):\n        return None\n\ntry:\n    with open(path) as f:\n        data = json.load(f)\n    ttft = metric(data, \"time_to_first_token\")\n    tpot = metric(data, \"inter_token_latency\")\n    if ttft is None or tpot is None:\n        raise ValueError(f\"missing {stat} metrics\")\n    result.update({\n        \"parse_ok\": True,\n        \"ttft_ms\": ttft,\n        \"tpot_ms\": tpot,\n        \"gating_ratio\": max(ttft / ttft_limit, tpot / tpot_limit),\n    })\n    breaches = []\n    if ttft > ttft_limit:\n        breaches.append(\"ttft\")\n    if tpot > tpot_limit:\n        breaches.append(\"tpot\")\n    result[\"breaches\"] = breaches\n    if rc != 0:\n        result[\"stop_reason\"] = \"unparseable_metrics\"\n    elif breaches:\n        result[\"stop_reason\"] = \"threshold_exceeded\"\n    else:\n        result[\"passed\"] = True\n        result[\"stop_reason\"] = \"\"\nexcept Exception as exc:\n    result[\"parse_error\"] = str(exc)\n\nprint(json.dumps(result, sort_keys=True))\nPY\n}\n\nwrite_sweep_files() {\n  local status=\"$1\"\n  local completed_at=\"${2:-}\"\n  local wall_seconds=\"${3:-}\"\n  SWEEP_STATUS=\"$status\" \\\n  RUN_COMPLETED_AT_VALUE=\"$completed_at\" \\\n  RUN_WALL_SECONDS_VALUE=\"$wall_seconds\" \\\n  COARSE_MAX_VALUE=\"${COARSE_MAX:-}\" \\\n  REFINED_MAX_VALUE=\"${REFINED_MAX:-}\" \\\n  SWEEP_STOP_REASON_VALUE=\"${SWEEP_STOP_REASON:-}\" \\\n  REFINE_SKIP_REASON_VALUE=\"${REFINE_SKIP_REASON:-}\" \\\n  SWEEP_MODE_VALUE=\"${SWEEP_MODE:-adaptive}\" \\\n  LO_VALUE=\"${LO:-}\" \\\n  HI_VALUE=\"${HI:-}\" \\\n    python3 - \"$RUN_META\" \"$SWEEP_DECISIONS_JSONL\" \"$SWEEP_DECISIONS\" <<'PY'\nimport json\nimport os\nimport sys\n\nrun_meta_path, decisions_jsonl, decisions_path = sys.argv[1:4]\n\ndef maybe_int_env(name):\n    raw = os.environ.get(name, \"\")\n    if raw == \"\":\n        return None\n    try:\n        return int(raw)\n    except ValueError:\n        return raw\n\ndef maybe_float_env(name):\n    raw = os.environ.get(name, \"\")\n    if raw == \"\":\n        return None\n    try:\n        return float(raw)\n    except ValueError:\n        return raw\n\nsteps = []\ntry:\n    with open(decisions_jsonl) as f:\n        for line in f:\n            line = line.strip()\n            if line:\n                steps.append(json.loads(line))\nexcept FileNotFoundError:\n    pass\n\nexecuted = [s.get(\"concurrency\") for s in steps if s.get(\"concurrency\") is not None]\nsummary = {\n    \"mode\": os.environ.get(\"SWEEP_MODE_VALUE\", \"adaptive\"),\n    \"status\": os.environ.get(\"SWEEP_STATUS\", \"\"),\n    \"stop_reason\": os.environ.get(\"SWEEP_STOP_REASON_VALUE\", \"\"),\n    \"refine_skip_reason\": os.environ.get(\"REFINE_SKIP_REASON_VALUE\", \"\"),\n    \"coarse_max\": maybe_int_env(\"COARSE_MAX_VALUE\"),\n    \"refined_max\": maybe_int_env(\"REFINED_MAX_VALUE\"),\n    \"lo\": maybe_int_env(\"LO_VALUE\"),\n    \"hi\": maybe_int_env(\"HI_VALUE\"),\n    \"executed_sequence\": executed,\n    \"thresholds\": {\n        \"stat\": os.environ.get(\"STOP_STAT\", \"p50\"),\n        \"ttft_limit_ms\": maybe_float_env(\"TTFT_LIMIT_MS\"),\n        \"tpot_limit_ms\": maybe_float_env(\"TPOT_LIMIT_MS\"),\n    },\n    \"adaptive\": {\n        \"start\": maybe_int_env(\"CONCURRENCY_START\"),\n        \"multiplier\": maybe_int_env(\"CONCURRENCY_MULTIPLIER\"),\n        \"max\": maybe_int_env(\"CONCURRENCY_MAX\"),\n    },\n    \"binary_search\": {\n        \"enabled\": os.environ.get(\"BINARY_SEARCH\", \"true\").lower() == \"true\",\n        \"max_steps\": maybe_int_env(\"BINARY_SEARCH_MAX_STEPS\"),\n        \"min_gap\": maybe_int_env(\"BINARY_SEARCH_MIN_GAP\"),\n        \"refine_lower_frac\": maybe_float_env(\"REFINE_LOWER_FRAC\"),\n        \"refine_upper_frac\": maybe_float_env(\"REFINE_UPPER_FRAC\"),\n    },\n    \"steps\": steps,\n}\n\nwith open(decisions_path, \"w\") as f:\n    json.dump(summary, f, indent=2, sort_keys=True)\n    f.write(\"\\n\")\n\ntry:\n    with open(run_meta_path) as f:\n        meta = json.load(f)\nexcept (FileNotFoundError, json.JSONDecodeError):\n    meta = {}\nmeta.update({\n    \"run_id\": os.environ.get(\"RUN_ID\", \"\"),\n    \"started_at_utc\": os.environ.get(\"RUN_STARTED_AT\", \"\"),\n    \"concurrencies\": os.environ.get(\"CONCURRENCIES\", \"\"),\n    \"server_runtime\": os.environ.get(\"SERVER_RUNTIME\", \"\"),\n    \"model_name\": os.environ.get(\"MODEL_NAME\", \"\"),\n    \"model_repo\": os.environ.get(\"MODEL_REPO\", \"\"),\n    \"aiperf_model_id\": os.environ.get(\"AIPERF_MODEL_ID\", \"\"),\n    \"aiperf_tokenizer_id\": os.environ.get(\"AIPERF_TOKENIZER_ID\", \"\"),\n    \"aiperf_ref\": os.environ.get(\"AIPERF_REF\", \"\"),\n    \"aiperf_scenario\": os.environ.get(\"AIPERF_SCENARIO\", \"\"),\n    \"aiperf_extra_inputs\": os.environ.get(\"AIPERF_EXTRA_INPUTS\", \"\"),\n    \"dataset_type\": os.environ.get(\"DATASET_TYPE\", \"\"),\n    \"dataset_path\": os.environ.get(\"DATASET_PATH\", \"\"),\n    \"dataset_subpath\": os.environ.get(\"DATASET_SUBPATH\", \"\"),\n    \"dataset_config_path\": os.environ.get(\"DATASET_CONFIG_PATH\", \"\"),\n    \"dataset_num_sessions\": maybe_int_env(\"DATASET_NUM_SESSIONS\"),\n    \"dataset_seed\": maybe_int_env(\"DATASET_SEED\"),\n    \"dataset_max_isl\": maybe_int_env(\"DATASET_MAX_ISL\"),\n    \"num_dataset_entries\": maybe_int_env(\"NUM_DATASET_ENTRIES\"),\n    \"bench_duration\": maybe_int_env(\"BENCH_DURATION\"),\n    \"sweep_mode\": summary[\"mode\"],\n    \"sweep_stop_reason\": summary[\"stop_reason\"],\n    \"coarse_max\": summary[\"coarse_max\"],\n    \"refined_max\": summary[\"refined_max\"],\n    \"executed_sequence\": executed,\n    \"sweep_steps\": steps,\n    \"sweep_decisions_path\": \"sweep_decisions.json\",\n})\nif os.environ.get(\"RUN_COMPLETED_AT_VALUE\"):\n    meta[\"completed_at_utc\"] = os.environ[\"RUN_COMPLETED_AT_VALUE\"]\nif os.environ.get(\"RUN_WALL_SECONDS_VALUE\"):\n    meta[\"wall_seconds_total\"] = maybe_int_env(\"RUN_WALL_SECONDS_VALUE\")\nwith open(run_meta_path, \"w\") as f:\n    json.dump(meta, f, indent=2, sort_keys=True)\n    f.write(\"\\n\")\nPY\n}\n\nshould_refine() {\n  local lo_ratio=\"$1\"\n  local hi_ratio=\"$2\"\n  python3 - \"$lo_ratio\" \"$hi_ratio\" \"0.85\" \"1.15\" <<'PY'\nimport sys\n\ndef as_float(raw):\n    if raw in (\"\", \"None\"):\n        return None\n    try:\n        return float(raw)\n    except ValueError:\n        return None\n\nlo, hi, lower, upper = [as_float(v) for v in sys.argv[1:5]]\nif lo is None or hi is None:\n    print(\"missing_refine_metrics\")\nelif lo <= lower and hi >= upper:\n    print(\"run\")\nelse:\n    print(\"refine_gate_not_met\")\nPY\n}\n\nrun_step() {\n  local N=\"$1\"\n  local PHASE=\"$2\"\n  local OUT=\"$ARTIFACTS_ROOT/concurrency_$N\"\n  if [ -d \"$OUT\" ]; then\n    echo \"[$(date -u +%H:%M:%S)] Cleaning previous step artifacts: $OUT\"\n    rm -rf \"$OUT\"\n  fi\n  mkdir -p \"$OUT/logs/aiperf\"\n\n  # config.yaml stub parsed by extract_metrics.sh; format mirrors\n  # the slurm `benchmark:` block so the same parser works.\n  printf '%s\\n' \\\n    '# Stub config for extract_metrics.sh -- only the `--concurrency N`' \\\n    '# token under the `benchmark:` block is consumed.' \\\n    'benchmark:' \\\n    '  type: \"custom\"' \\\n    '  command: |' \\\n    \"    aiperf profile --concurrency $N\" \\\n    > \"$OUT/config.yaml\"\n\n  # Pre-run pod identity check\n  PRE_ID=$(get_server_id)\n  if [ \"$PRE_ID\" != \"$INITIAL_ID\" ]; then\n    echo \"WARNING: server pod identity changed before concurrency=$N (was $INITIAL_ID, now $PRE_ID)\"\n    echo \"RESTART_BEFORE_RUN initial=$INITIAL_ID current=$PRE_ID\" >> \"$OUT/dirty.flag\"\n  fi\n\n  # Resolve server pod name once per step (handles the case\n  # where the server Pod was rescheduled between steps).\n  SERVER_POD=$(resolve_server_pod)\n  echo \"[$(date -u +%H:%M:%S)] Telemetry target pod: ${SERVER_POD:-<none>}\"\n\n  # Start background telemetry scrape for this step.\n  scrape_loop \"$OUT\" &\n  SCRAPE_PID=$!\n\n  echo \"[$(date -u +%H:%M:%S)] Running aiperf at concurrency=$N ($PHASE)...\"\n  set +e\n  set -- profile \\\n    --url \"$SERVER_URL\" \\\n    --model \"$AIPERF_MODEL_ID\" \\\n    --tokenizer \"$AIPERF_TOKENIZER_ID\" \\\n    --use-server-token-count \\\n    --endpoint-type chat \\\n    --streaming \\\n    --custom-dataset-type \"mooncake_trace\" \\\n    --input-file \"$DATASET_PATH\" \\\n    --concurrency \"$N\" \\\n    --num-profile-runs \"1\" \\\n    --unsafe-override \\\n    --ui simple \\\n    --artifact-dir \"$OUT/logs/aiperf\"\n  if [ -n \"\" ]; then\n    set -- \"$@\" --cache-bust \"\"\n  fi\n  if [ -n \"\" ]; then\n    set -- \"$@\" --scenario \"\"\n  fi\n  if [ -n \"\" ]; then\n    set -- \"$@\" --num-dataset-entries \"\"\n  fi\n  # Excluded warmup ramp (WARMUP_REQUEST_MULTIPLIER x concurrency\n  # requests, dropped from metrics). Works in every workload mode.\n  if [ -n \"1\" ] && [ \"1\" -gt 0 ] 2>/dev/null; then\n    WARMUP_COUNT=$(( WARMUP_REQUEST_MULTIPLIER * N ))\n    set -- \"$@\" --warmup-request-count \"$WARMUP_COUNT\"\n    echo \"  warmup (excluded): $WARMUP_COUNT requests\"\n  fi\n  # Workload cap, in priority order:\n  #  1. REQUEST_COUNT_MULTIPLIER>0 -> fixed --request-count (synthetic\n  #     datasets only; IGNORED by mooncake fixed_schedule replay).\n  #  2. BENCH_DURATION>0 -> fixed --benchmark-duration + ramp/grace.\n  #  3. neither -> FULL-TRACE REPLAY: every rung replays the entire\n  #     dataset, so the cISL/nISL/OSL work distribution is identical\n  #     across concurrencies and only the work-rate changes. This is\n  #     the correct comparable mode for mooncake replay -- size the\n  #     dataset (num-sessions) to bound per-rung wall time.\n  if [ -n \"\" ] && [ \"\" -gt 0 ] 2>/dev/null; then\n    REQ_COUNT=$(( REQUEST_COUNT_MULTIPLIER * N ))\n    set -- \"$@\" --request-count \"$REQ_COUNT\"\n    echo \"  workload: fixed request-count=$REQ_COUNT (x concurrency=$N)\"\n  elif [ -n \"\" ] && [ \"\" -gt 0 ] 2>/dev/null; then\n    set -- \"$@\" --benchmark-duration \"120\"\n    if [ -n \"30\" ]; then\n      set -- \"$@\" --concurrency-ramp-duration \"30\"\n    fi\n    if [ -n \"120\" ]; then\n      set -- \"$@\" --benchmark-grace-period \"120\"\n    fi\n  else\n    echo \"  workload: full-trace replay (entire dataset; identical work distribution across rungs)\"\n  fi\n  if [ -n \"600\" ]; then\n    set -- \"$@\" --request-timeout-seconds \"3600\"\n  fi\n  if [ -n \"ignore_eos:true\" ]; then\n    set -- \"$@\" --extra-inputs \"ignore_eos:true\"\n  fi\n  aiperf \"$@\"\n  AIPERF_RC=$?\n  set -e\n\n  # Stop the scrape loop. `kill` returns non-zero if the loop\n  # already exited (it shouldn't); `|| true` swallows that.\n  kill \"$SCRAPE_PID\" 2>/dev/null || true\n  wait \"$SCRAPE_PID\" 2>/dev/null || true\n\n  if [ $AIPERF_RC -ne 0 ]; then\n    echo \"aiperf exited non-zero ($AIPERF_RC) for concurrency=$N\"\n    echo \"AIPERF_EXIT=$AIPERF_RC\" >> \"$OUT/dirty.flag\"\n  fi\n\n  # Post-run pod identity check\n  POST_ID=$(get_server_id)\n  if [ \"$POST_ID\" != \"$INITIAL_ID\" ]; then\n    echo \"WARNING: server pod identity changed during/after concurrency=$N (was $INITIAL_ID, now $POST_ID)\"\n    echo \"RESTART_AFTER_RUN initial=$INITIAL_ID current=$POST_ID\" >> \"$OUT/dirty.flag\"\n  fi\n\n  # Scrape the server /metrics endpoint for runtime-specific cache stats.\n  curl -fsS --max-time 30 \"$SERVER_URL/metrics\" > \"$OUT/sglang_metrics.prom\" 2>/dev/null \\\n    || echo \"(metrics scrape failed)\" > \"$OUT/sglang_metrics.prom\"\n\n  # Dedup inputs.json. AIPerf materializes a fresh ~2.2 GiB\n  # pre-tokenized dataset cache into every --artifact-dir, but\n  # tokenizer + dataset are identical across sweep steps so all\n  # copies are byte-identical (the in-memory dataset cache\n  # (\"Memory-mapped dataset cache HIT\") confirms this on the\n  # AIPerf side). Promote the first step's copy to a per-run\n  # shared location and replace the rest with symlinks. Saves\n  # ~13 GiB on the artifacts PVC per 7-step sweep.\n  INPUTS=\"$OUT/logs/aiperf/inputs.json\"\n  SHARED=\"$ARTIFACTS_ROOT/_shared/inputs.json\"\n  if [ -f \"$INPUTS\" ] && [ ! -L \"$INPUTS\" ]; then\n    mkdir -p \"$ARTIFACTS_ROOT/_shared\"\n    if [ -e \"$SHARED\" ]; then\n      rm -f \"$INPUTS\"\n      echo \"[$(date -u +%H:%M:%S)] Deduped inputs.json for concurrency=$N (linked to $SHARED)\"\n    else\n      mv \"$INPUTS\" \"$SHARED\"\n      echo \"[$(date -u +%H:%M:%S)] Promoted concurrency=$N inputs.json to $SHARED\"\n    fi\n    ln -sfn \"$SHARED\" \"$INPUTS\"\n  fi\n\n  STEP_RESULT=$(classify_step \"$OUT\" \"$N\" \"$PHASE\" \"$AIPERF_RC\")\n  LAST_STEP_RESULT_FILE=\"$OUT/sweep_result.json\"\n  printf '%s\\n' \"$STEP_RESULT\" > \"$LAST_STEP_RESULT_FILE\"\n  printf '%s\\n' \"$STEP_RESULT\" >> \"$SWEEP_DECISIONS_JSONL\"\n  echo \"[$(date -u +%H:%M:%S)] Concurrency=$N decision: passed=$(json_field \"$LAST_STEP_RESULT_FILE\" passed) reason=$(json_field \"$LAST_STEP_RESULT_FILE\" stop_reason)\"\n\n  echo \"[$(date -u +%H:%M:%S)] Concurrency=$N done. Output:\"\n  ls -la \"$OUT\" || true\n  ls -la \"$OUT/logs/aiperf\" || true\n}\n\nINITIAL_ID=$(get_server_id)\necho \"[$(date -u +%H:%M:%S)] Initial server pod identity: $INITIAL_ID\"\n\nCLEAN_ROOT=$(printf '%s' \"${CLEAN_ARTIFACTS_ROOT:-true}\" | tr '[:upper:]' '[:lower:]')\nif [ \"$CLEAN_ROOT\" = \"true\" ] && [ -d \"$ARTIFACTS_ROOT\" ]; then\n  echo \"[$(date -u +%H:%M:%S)] Cleaning previous artifacts root: $ARTIFACTS_ROOT\"\n  rm -rf \"$ARTIFACTS_ROOT\"\nelif [ \"$CLEAN_ROOT\" != \"true\" ] && [ -d \"$ARTIFACTS_ROOT\" ]; then\n  echo \"[$(date -u +%H:%M:%S)] Preserving previous artifacts root for resume: $ARTIFACTS_ROOT\"\nfi\nmkdir -p \"$ARTIFACTS_ROOT\"\nsmoke_test_model \"$ARTIFACTS_ROOT/smoke_chat_completion.json\"\nsmoke_test_large_context \"$ARTIFACTS_ROOT/smoke_large_context_completion.json\"\necho \"$INITIAL_ID\" > \"$ARTIFACTS_ROOT/server_initial.id\"\nMETRICS_SURFACE=\"$ARTIFACTS_ROOT/server_metrics_surface.prom\"\nif curl -fsS --max-time 30 \"$SERVER_URL/metrics\" > \"$METRICS_SURFACE\" 2>/dev/null; then\n  echo \"[$(date -u +%H:%M:%S)] Captured initial server /metrics surface: $METRICS_SURFACE\"\n  if [ \"${SERVER_RUNTIME:-sglang}\" = \"vllm\" ]; then\n    PREFIX_OK=0\n    if grep -Eq '^vllm:prefix_cache_hits(_total)?(\\{|[[:space:]])' \"$METRICS_SURFACE\" \\\n      && grep -Eq '^vllm:prefix_cache_queries(_total)?(\\{|[[:space:]])' \"$METRICS_SURFACE\"; then\n      PREFIX_OK=1\n    elif grep -Eq '^vllm:(gpu_)?prefix_cache_hit_rate(\\{|[[:space:]])' \"$METRICS_SURFACE\"; then\n      PREFIX_OK=1\n    fi\n    MISSING=\"\"\n    [ \"$PREFIX_OK\" -eq 1 ] || MISSING=\"$MISSING prefix_cache\"\n    grep -Eq '^vllm:(kv_cache_usage_perc|gpu_cache_usage_perc)(\\{|[[:space:]])' \"$METRICS_SURFACE\" || MISSING=\"$MISSING kv_cache_usage\"\n    grep -Eq '^vllm:num_requests_running(\\{|[[:space:]])' \"$METRICS_SURFACE\" || MISSING=\"$MISSING num_requests_running\"\n    grep -Eq '^vllm:num_requests_waiting(\\{|[[:space:]])' \"$METRICS_SURFACE\" || MISSING=\"$MISSING num_requests_waiting\"\n    if [ -n \"$MISSING\" ]; then\n      echo \"FATAL: vLLM /metrics surface is missing expected metric group(s):$MISSING\" >&2\n      echo \"Inspect $METRICS_SURFACE and update scripts/aggregate_metrics.py before launching the sweep.\" >&2\n      exit 64\n    fi\n  fi\nelse\n  echo \"FATAL: unable to capture initial server /metrics surface before sweep\" >&2\n  exit 64\nfi\n\n# ------- Run meta (lifecycle bookend) -------------------------\nRUN_STARTED_AT=\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\nRUN_STARTED_EPOCH=\"$(date -u +%s)\"\nRUN_META=\"$ARTIFACTS_ROOT/run_meta.json\"\nSWEEP_DECISIONS_JSONL=\"$ARTIFACTS_ROOT/sweep_decisions.jsonl.tmp\"\nSWEEP_DECISIONS=\"$ARTIFACTS_ROOT/sweep_decisions.json\"\n: > \"$SWEEP_DECISIONS_JSONL\"\nSWEEP_MODE=\"adaptive\"\nSWEEP_STOP_REASON=\"\"\nREFINE_SKIP_REASON=\"\"\nCOARSE_MAX=\"\"\nREFINED_MAX=\"\"\nLO=\"\"\nHI=\"\"\nwrite_sweep_files \"started\"\necho \"[$(date -u +%H:%M:%S)] Wrote $RUN_META (start)\"\n\n# ------- Sweep ------------------------------------------------\nif [ -n \"${CONCURRENCIES:-}\" ]; then\n  SWEEP_MODE=\"fixed\"\n  echo \"[$(date -u +%H:%M:%S)] CONCURRENCIES is set; running fixed list: 128 256 512 1024\"\n  for N in 128 256 512 1024; do\n    run_step \"$N\" \"fixed\"\n    write_sweep_files \"fixed-running\"\n  done\n  SWEEP_STOP_REASON=\"fixed_concurrencies_complete\"\n  write_sweep_files \"fixed-complete\"\nelse\n  echo \"[$(date -u +%H:%M:%S)] Adaptive Phase 1: start=16 multiplier=2 max=512 stop=p50 ttft>10000ms tpot>100ms\"\n  LO=0\n  HI=0\n  LAST_PASS_RATIO=\"\"\n  FIRST_FAIL_RATIO=\"\"\n  N=\"16\"\n  while :; do\n    run_step \"$N\" \"phase1\"\n    PASSED=$(json_field \"$LAST_STEP_RESULT_FILE\" passed)\n    RATIO=$(json_field \"$LAST_STEP_RESULT_FILE\" gating_ratio)\n    REASON=$(json_field \"$LAST_STEP_RESULT_FILE\" stop_reason)\n    if [ \"$PASSED\" = \"true\" ]; then\n      LO=\"$N\"\n      COARSE_MAX=\"$LO\"\n      REFINED_MAX=\"$LO\"\n      LAST_PASS_RATIO=\"$RATIO\"\n      NEXT_N=$((N * CONCURRENCY_MULTIPLIER))\n      if [ \"$N\" -ge \"512\" ] || [ \"$NEXT_N\" -gt \"512\" ]; then\n        SWEEP_STOP_REASON=\"ceiling\"\n        echo \"[$(date -u +%H:%M:%S)] Adaptive Phase 1 reached ceiling at concurrency=$LO\"\n        break\n      fi\n      N=\"$NEXT_N\"\n    else\n      HI=\"$N\"\n      FIRST_FAIL_RATIO=\"$RATIO\"\n      SWEEP_STOP_REASON=\"${REASON:-unparseable_metrics}\"\n      if [ \"$LO\" -le 0 ]; then\n        echo \"[$(date -u +%H:%M:%S)] Adaptive Phase 1: SLA unmet at start concurrency 16 -> max sustainable < 16 (reason=$SWEEP_STOP_REASON)\"\n      else\n        echo \"[$(date -u +%H:%M:%S)] Adaptive Phase 1 stopped at concurrency=$HI reason=$SWEEP_STOP_REASON; coarse_max=$LO\"\n      fi\n      break\n    fi\n  done\n\n  # Record the factor-of-two answer before optional refinement.\n  write_sweep_files \"coarse-complete\"\n\n  BINARY_SEARCH_ENABLED=$(printf '%s' \"${BINARY_SEARCH:-true}\" | tr '[:upper:]' '[:lower:]')\n  if [ \"$BINARY_SEARCH_ENABLED\" != \"true\" ]; then\n    REFINE_SKIP_REASON=\"disabled\"\n  elif [ \"$LO\" -le 0 ]; then\n    REFINE_SKIP_REASON=\"no_passing_concurrency\"\n  elif [ \"$HI\" -le \"$LO\" ]; then\n    REFINE_SKIP_REASON=\"no_failing_bracket\"\n  elif [ $((HI - LO)) -le \"16\" ]; then\n    REFINE_SKIP_REASON=\"bracket_within_min_gap\"\n  else\n    REFINE_GATE=$(should_refine \"$LAST_PASS_RATIO\" \"$FIRST_FAIL_RATIO\")\n    if [ \"$REFINE_GATE\" = \"run\" ]; then\n      echo \"[$(date -u +%H:%M:%S)] Adaptive Phase 2: binary-searching bracket lo=$LO hi=$HI\"\n      STEP=0\n      while [ $((HI - LO)) -gt \"16\" ] && [ \"$STEP\" -lt \"4\" ]; do\n        MID=$(((LO + HI) / 2))\n        run_step \"$MID\" \"phase2\"\n        PASSED=$(json_field \"$LAST_STEP_RESULT_FILE\" passed)\n        RATIO=$(json_field \"$LAST_STEP_RESULT_FILE\" gating_ratio)\n        if [ \"$PASSED\" = \"true\" ]; then\n          LO=\"$MID\"\n          REFINED_MAX=\"$LO\"\n          LAST_PASS_RATIO=\"$RATIO\"\n        else\n          HI=\"$MID\"\n          FIRST_FAIL_RATIO=\"$RATIO\"\n        fi\n        STEP=$((STEP + 1))\n        write_sweep_files \"refining\"\n      done\n      REFINED_MAX=\"$LO\"\n      REFINE_SKIP_REASON=\"\"\n    else\n      REFINE_SKIP_REASON=\"$REFINE_GATE\"\n      echo \"[$(date -u +%H:%M:%S)] Skipping Phase 2: $REFINE_SKIP_REASON (lo_ratio=${LAST_PASS_RATIO:-} hi_ratio=${FIRST_FAIL_RATIO:-})\"\n    fi\n  fi\n  write_sweep_files \"adaptive-complete\"\nfi\n\n# ------- Run meta (close lifecycle) ---------------------------\nRUN_COMPLETED_AT=\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\nRUN_COMPLETED_EPOCH=\"$(date -u +%s)\"\nRUN_WALL_SECONDS=$((RUN_COMPLETED_EPOCH - RUN_STARTED_EPOCH))\nwrite_sweep_files \"complete\" \"$RUN_COMPLETED_AT\" \"$RUN_WALL_SECONDS\"\nrm -f \"$SWEEP_DECISIONS_JSONL\"\necho \"[$(date -u +%H:%M:%S)] Updated $RUN_META (complete, wall=${RUN_WALL_SECONDS}s)\"\n\necho \"[$(date -u +%H:%M:%S)] Sweep complete: $ARTIFACTS_ROOT\"\nls -la \"$ARTIFACTS_ROOT\"\n"
