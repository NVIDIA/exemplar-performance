envelope:
  name: glm5-agg-8k1k-sglang15-c4-256
  model: glm5-fp8
  gpu_type: B200
  arch: amd64
  engine: sglang
  serving_mode: aggregated
  framework: none
  scenario: llm-perf
  distribution: synthetic
  mode: synthetic
  launcher: aiperf
  goal: pareto
  status: wip
  results_link: ./RESULTS.md
  provenance:
    schema_version: k8s.llm-perf.v1
    official: false
    source_image_tag: lmsysorg/sglang:v0.5.15.post1-cu130
    image_digest: sha256:00c53fe4c31bf22d7b37537f28bbdfd924c02de13cdfb4bff7378c9c34d75ab2
    image_ref: docker.io/lmsysorg/sglang@sha256:00c53fe4c31bf22d7b37537f28bbdfd924c02de13cdfb4bff7378c9c34d75ab2
  exemplar:
    metric: pareto_geomean
    unit: geomean(tps/gpu*tps/user)
    reference: null
    tolerance_pct: 5
    comparison: point-by-point geomean g(p)=sqrt(Output-TPS/GPU * Output-TPS/user) per rung; scalar = geomean over rungs
  requires:
    gpu: { count: 8 }
    tolerations: [nvidia.com/gpu, dedicated]

serving:
  stack: sglang-agg
  model_repo: zai-org/GLM-5-FP8
  model_revision: 4f96cc5eec29dcee5d6ded54f7ffe889438f9516
  served_model: GLM-5-FP8
  telemetry_container: sglang
  tp: 8
  context_length: 9600
  startup_timeout_s: 7200
  readiness_enabled: false
  liveness_enabled: false
  env:
    - { name: PYTHONNOUSERSITE, value: "1" }
    - { name: PYTHONUNBUFFERED, value: "1" }
    - { name: SGLANG_ENABLE_JIT_DEEPGEMM, value: "1" }
    - { name: NCCL_CUMEM_ENABLE, value: "1" }
  extra_args:
    - "--data-parallel-size 1"
    - "--expert-parallel-size 1"
    - "--tool-call-parser glm47"
    - "--reasoning-parser glm45"
    - "--trust-remote-code"
    - "--quantization fp8"
    - "--kv-cache-dtype fp8_e4m3"
    - "--attention-backend nsa"
    - "--nsa-decode-backend trtllm"
    - "--nsa-prefill-backend trtllm"
    - "--moe-runner-backend flashinfer_trtllm"
    - "--mem-fraction-static 0.85"
    - "--chunked-prefill-size 32768"
    - "--max-prefill-tokens 32768"
    - "--max-running-requests 256"
    - "--cuda-graph-max-bs 256"
    - "--enable-flashinfer-allreduce-fusion"
    - "--disable-radix-cache"
    - "--stream-interval 30"
    - "--model-loader-extra-config '{\"enable_multithread_load\": true}'"

bench:
  # AIPerf 0.11 handles NaN samples, but this SGLang surface also changes histogram
  # bucket schemas at runtime. LLMB preserves raw /metrics snapshots independently, so disable only
  # AIPerf's incompatible Prometheus ingestion while keeping all request metrics.
  aiperf_ref: "git+https://github.com/ai-dynamo/aiperf.git@38687855e98044fcf12ee48c6794128f10b6780b"
  aiperf_unsafe_override: false
  aiperf_server_metrics: false
  synthetic:
    isl: 7373
    isl_stddev: 473
    osl: 922
    osl_stddev: 59
    num_entries: 2560
    request_count_multiplier: 10
    warmup_request_multiplier: 2
    seed: 42
    nominal_isl: 8192
    nominal_osl: 1024
    range_ratio: 0.8
  sweep_concurrency: [4, 8, 16, 32, 64, 128, 256]
  sweep_mode: fixed
  endpoint_type: completions
  extra_inputs: "ignore_eos:true"
  connection_reuse: sticky-user-sessions
  request_timeout_s: 3600
  gpu_telemetry: true
