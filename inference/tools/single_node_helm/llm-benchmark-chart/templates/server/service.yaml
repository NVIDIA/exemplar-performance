apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-server
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.environment.SERVER_PORT | int }}
    targetPort: {{ .Values.environment.SERVER_PORT | int }}
    protocol: TCP
  selector:
    app: {{ .Release.Name }}-server
