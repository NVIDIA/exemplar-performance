environment:
  # Server Configuration
  SERVER_TYPE: "vLLM"  # Can be "vLLM" or "NIM"
  SERVER_IMAGE: "vllm/vllm-openai:v0.8.5"  # Path to server image
  SERVER_ARGS: ""
  HEALTH_CHECK_ENDPOINT: "health"
  
  # Model Configuration
  MODEL_NAME: "meta-llama/Llama-3.2-1B-Instruct"
  MODEL_NAME_CLEANED: "llama-3.2-1b-instruct"  # used in the benchmark result file name
  MODEL_TOKENIZER: "meta-llama/Llama-3.2-1B-Instruct"  # matches the path of the tokenizer on the HF registry
  HF_TOKEN: ""  # Your Hugging Face API token

  # Benchmark Parameters
  MIN_REQUESTS: "20"
  USE_CASES: "chat:128/128 summarization:4096/512"
  CONCURRENCY_RANGE: "1 25 50 100"
  REQUEST_MULTIPLIER: "5"
  NUM_GPUS: "1"  # Configure the number of GPUs to use (e.g., "1", "2", "4", "8")

  # Results Configuration
  RESULTS_PATH: "/vllm-results"  # Directory where benchmark results will be stored

# provided on startup automatically by NVCF
ngcImagePullSecretName: ""
nvctNcaId: ""
nvctTaskId: ""
nvctTaskName: ""
nvctResultsDir: ""
nvctProgressFilePath: ""
