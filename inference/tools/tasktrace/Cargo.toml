[package]
name = "tasktrace"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Replay recorded tool-side workloads and measure their CPU and memory demand."
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/exemplar-performance"

[[bin]]
name = "tasktrace"
path = "src/main.rs"

[dependencies]
flate2 = "=1.0.28"
glob = "=0.3.3"
ignore = "=0.4.23"
indexmap = "=2.2.3"
libc = "=0.2.153"
regex = "=1.10.3"
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = { version = "=1.0.114", features = ["preserve_order"] }
serde_yaml = "=0.9.34"
sha2 = "=0.10.8"

[dev-dependencies]
tempfile = "=3.10.1"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
